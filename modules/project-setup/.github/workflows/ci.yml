name: CI

on:
  push:
    branches: ["master", "workflow*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend & script tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  setup-windows:
    name: Setup (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run check
      - name: Verify pinned Unity CLI installation plan without installing Unity
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml disposable_preview_smoke -- --ignored --nocapture
      - name: Build Windows release binary and NSIS bundle
        run: npm run build -- --bundles nsis
      - name: Retain development packages (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: setup-development-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

  setup-linux:
    name: Setup (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file \
            rpm
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run check
      - name: Verify pinned Unity CLI installation plan without installing Unity
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml disposable_preview_smoke -- --ignored --nocapture
      - name: Build Linux AppImage, DEB, and RPM bundle
        run: NO_STRIP=1 npm run build -- --bundles appimage,deb,rpm
      - name: Retain development packages (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: setup-development-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  setup-macos:
    name: Setup (macOS ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Apple silicon
          - os: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Use a canonical temporary path for macOS test fixtures
        shell: bash
        run: echo "TMPDIR=$(node -p "require('fs').realpathSync(require('os').tmpdir())")" >> "$GITHUB_ENV"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run check
      - name: Verify pinned Unity CLI installation plan without installing Unity
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml disposable_preview_smoke -- --ignored --nocapture
      - name: Build macOS DMG bundle
        run: npm run build -- --bundles dmg
      - name: Retain development packages (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: setup-development-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

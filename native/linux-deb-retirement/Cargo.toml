[package]
name = "creator-hub-linux-deb-retirement"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
experimental-transaction = ["dep:signal-hook"]

[dependencies]
serde_json = "1"
sha2 = "0.10"
tar = { version = "=0.4.46", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
signal-hook = { version = "=0.4.5", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"

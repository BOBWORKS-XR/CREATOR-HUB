[package]
name = "creator-hub-flatpak-native-activation"
version = "0.1.16"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
minisign-verify = "=0.2.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "=0.18.4"
gtk = "=0.18.2"

[[bin]]
name = "creator-hub-flatpak-activate"
path = "src/main.rs"

[[bin]]
name = "creator-hub-flatpak-check-native-input"
path = "src/check.rs"

[workspace]

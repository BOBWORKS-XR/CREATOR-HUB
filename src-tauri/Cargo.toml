[package]
name = "creator-hub"
version = "0.1.0-alpha.1"
description = "Creator Hub app manager"
authors = ["Creator Works"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
minisign-verify = "0.2.5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "json"] }
sysinfo = "0.38"
fs2 = "0.4"
tokio = { version = "1", features = ["macros", "time"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

name: Windows public012 to R2 guarded NSIS (not signed updater)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    if: github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/windows-menu-merge-20261027'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Refusal and exact-binding tests before native execution
        run: node --test --test-concurrency=1 scripts/native-windows-012-r2-guarded.test.cjs
      - name: Bind the original independently reviewed R2 data artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = gh api repos/BOBWORKS-XR/CREATOR-HUB/actions/artifacts/13143820688 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.id -ne 13143820688 -or $artifact.name -cne 'windows-016-acceptance-input' -or $artifact.expired -ne $false -or $artifact.size_in_bytes -ne 38215321 -or $artifact.digest -cne 'sha256:2a430ded3715f28d6b0203afd41dd1986d603c7dd4998a388f74b6a8219b6f84' -or $artifact.workflow_run.id -ne 41448285787) { throw 'Exact R2 data artifact differs.' }
          $run = gh api repos/BOBWORKS-XR/CREATOR-HUB/actions/runs/41448285787 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.event -cne 'workflow_dispatch' -or $run.head_sha -cne '1f5abcfd34c05acf3e60f8c776f49df1b08d5fc2' -or $run.path -cne '.github/workflows/windows-016-input.yml' -or $run.repository.full_name -cne 'BOBWORKS-XR/CREATOR-HUB' -or $run.head_repository.full_name -cne 'BOBWORKS-XR/CREATOR-HUB') { throw 'R2 stager provenance differs.' }
          New-Item -ItemType Directory -Path artifacts/guarded-012-r2 | Out-Null
          @{artifactId=$artifact.id;runId=$run.id;artifactSource=$run.head_sha;archiveSha256='2a430ded3715f28d6b0203afd41dd1986d603c7dd4998a388f74b6a8219b6f84';harnessSource=$env:GITHUB_SHA} | ConvertTo-Json | Set-Content artifacts/guarded-012-r2/input-binding.json -Encoding utf8NoBOM
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 13143820688
          github-token: ${{ github.token }}
          run-id: 41448285787
          path: artifacts/guarded-012-r2/candidate
          merge-multiple: true
      - name: Refuse extra files and admit only the exact R2 installer
        shell: pwsh
        run: |
          $directory = (Get-Item -LiteralPath artifacts/guarded-012-r2/candidate).FullName
          $allowed = @('Creator.Hub_0.1.16_x64-setup.exe','creator-hub-windows-x86_64.json','creator-hub-windows-x86_64.json.minisig','latest.json')
          foreach ($file in Get-ChildItem -LiteralPath $directory -Recurse -Force) {
            if ($file.Attributes -band [IO.FileAttributes]::ReparsePoint -or $file.PSIsContainer -or $file.Name -cnotin $allowed -or $file.DirectoryName -cne $directory) { throw 'Only flat reviewed input files are admitted.' }
          }
          node scripts/windows-incoming-016.cjs inspect-installer $directory
          if ($LASTEXITCODE -ne 0) { throw 'Exact R2 installer refused.' }
      - name: Stage exact public 0.1.12 installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/BOBWORKS-XR/CREATOR-HUB/releases/download/v0.1.12/Creator.Hub_0.1.12_x64-setup.exe' -OutFile artifacts/guarded-012-r2/public012.exe -TimeoutSec 180
          if ((Get-FileHash -LiteralPath artifacts/guarded-012-r2/public012.exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne '0cd8a4493dd9a5b77fbc5fe160582a2b2698fea43aedd9118b2d5b3bd3c51a18') { throw 'Public 0.1.12 installer differs.' }
      - name: Guarded NSIS upgrade and fixture preservation
        env:
          CREATOR_WINDOWS_012_R2_GUARDED: '1'
        run: node scripts/native-windows-012-r2-guarded.cjs "${{ github.workspace }}/artifacts/guarded-012-r2/candidate/Creator.Hub_0.1.16_x64-setup.exe" "${{ github.workspace }}/artifacts/guarded-012-r2/public012.exe"
      - name: Validate the scoped report
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -LiteralPath artifacts -Recurse -File -Filter guarded-012-r2-report.json)
          if ($reports.Count -ne 1) { throw 'Expected exactly one guarded report.' }
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));require('./scripts/windows-012-r2-guarded-contract.cjs').checkReceipt(r);require('assert').strictEqual(r.testSource,process.env.GITHUB_SHA)" $reports[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Guarded receipt refused.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-012-r2-guarded-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/guarded-012-r2/input-binding.json
            artifacts/native-012-r2-guarded-*/*.json

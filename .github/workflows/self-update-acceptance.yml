name: Public Hub self-update acceptance
on:
  workflow_dispatch:
    inputs:
      target_version:
        description: Exact public version; this reviewed harness accepts only 0.1.19
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  self-update:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate exact public target
        shell: pwsh
        env:
          REQUESTED_TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          if ($env:REQUESTED_TARGET_VERSION -cne '0.1.19') { throw 'Only reviewed public 0.1.18 to 0.1.19 acceptance is allowed.' }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -cne '0.1.19') { throw 'Unexpected source version.' }
      - run: npm ci
      - name: Test public binding and direct-mode safeguards
        run: node --test scripts/self-update-baselines.test.cjs scripts/check-release-feed.test.cjs scripts/public-self-update-019.test.cjs scripts/native-public-update-019.test.cjs
      - name: Checkout immutable SDK dependency inputs without building the app
        uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ed3e7dabc2e83fea8b7cadce63bbeb502fed2306
          path: .public-sdk
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /modules/mcp/package.json
            /modules/mcp/package-lock.json
      - name: Install immutable official SDK for reconnect checks
        run: npm ci --prefix .public-sdk/modules/mcp --ignore-scripts
      - name: Download unauthenticated public assets and verify every payload
        shell: pwsh
        env:
          CREATOR_PUBLIC_SELF_UPDATE_019: '1'
          CREATOR_SELF_UPDATE_TARGET_VERSION: '0.1.19'
        run: |
          node scripts/public-self-update-019.cjs prepare
          if ($LASTEXITCODE -ne 0) { throw 'Public19 input binding failed.' }
          $folder = 'artifacts/self-update-target'
          $installer = Join-Path $folder 'Creator.Hub_0.1.19_x64-setup.exe'
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          & $sevenZip x $installer ("-o$folder/extracted") '-y' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Public19 extraction failed.' }
          node scripts/public-self-update-019.cjs verify
          if ($LASTEXITCODE -ne 0) { throw 'Public19 packaged resources differ.' }
      - name: Test actual public update, cancellation, restart and MCP reconnection
        env:
          CREATOR_PUBLIC_SELF_UPDATE_019: '1'
          CREATOR_SELF_UPDATE_TARGET_VERSION: '0.1.19'
          CREATOR_SELF_UPDATE_INSTALLER_SHA256: '1a0d85127827b854dcdd3ae89f4c5e2aca3824b81623f1b9b05e022871ee6419'
          CREATOR_SELF_UPDATE_EXECUTABLE_SHA256: '5bd277950ac6409b6820005e28767bbd3dd1281ea84e5f87f9b1990ffcda5d12'
        run: node scripts/native-public-update-019.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-public-self-update
          path: |
            artifacts/native-suite-*/self-update-report.json
            artifacts/native-suite-*/*.png
            artifacts/native-suite-*/startup.json
            artifacts/native-suite-*/dialogs.json
            artifacts/native-suite-*/webview-policy.json
            artifacts/self-update-target/public-*.json
            artifacts/self-update-target/creator-hub-windows-x86_64.json
            artifacts/self-update-target/creator-hub-windows-x86_64.json.minisig
            artifacts/self-update-target/latest.json
            artifacts/self-update-target/SHA256SUMS.txt
            artifacts/self-update-target/Creator.Hub_0.1.19_x64-setup.exe.sig
          if-no-files-found: error

name: Exact public Windows 019 to 020 acceptance
on:
  workflow_dispatch:
    inputs:
      expected_harness_commit:
        required: true
        type: string
      binding_sha256:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    if: github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.ref == 'refs/heads/validation/windows-public-update-020-20261105'
    name: acceptance-${{ matrix.case }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: mcp-restore
            tool: mcp
            restore: 'true'
          - case: setup-restore
            tool: setup
            restore: 'true'
          - case: setup-no-restore
            tool: setup
            restore: 'false'
    env:
      EXPECTED_HARNESS_COMMIT: ${{ inputs.expected_harness_commit }}
      CREATOR_PUBLIC_BINDING_SHA256: ${{ inputs.binding_sha256 }}
      CREATOR_PUBLIC_UPDATE_020: '1'
      CREATOR_SELF_UPDATE_TARGET_VERSION: '0.1.20'
      CREATOR_SELF_UPDATE_INSTALLER_SHA256: '2915ffac9b1c39f5facbd4030eb6addf837e0d414b96835e0f0be1564577666b'
      CREATOR_SELF_UPDATE_EXECUTABLE_SHA256: '06908120c81f471e9774edbe5a2d09fa3c985357eea373e29e75404d1f133cf5'
      CREATOR_OUTGOING_CASE: ${{ matrix.case }}
      CREATOR_OUTGOING_LAST_TOOL: ${{ matrix.tool }}
      CREATOR_OUTGOING_RESTORE: ${{ matrix.restore }}
    steps:
      - name: Require exact reviewed source before checkout
        shell: pwsh
        run: |
          if ($env:EXPECTED_HARNESS_COMMIT -cnotmatch '^[a-f0-9]{40}$' -or $env:EXPECTED_HARNESS_COMMIT -cne $env:GITHUB_SHA) { throw 'Wrong harness source' }
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Public-only admission before acquisition or installation
        run: node -e "require('./scripts/public-update-020.cjs').assertAdmission()"
      - name: Focused and inherited preflight
        run: node --test --test-concurrency=1 scripts/public-update-020.test.cjs scripts/windows-outgoing-019-test.cjs scripts/self-update-outgoing-019-feed.test.cjs
      - name: Parse inherited PowerShell without native execution
        shell: pwsh
        run: ./scripts/windows-outgoing-019-binding-probe.ps1
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: 9b65dd7aedc2eb224755db3d733a7fb19e8e8f62
          path: product
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /modules/mcp/package.json
            /modules/mcp/package-lock.json
      - name: Verify immutable SDK input checkout
        shell: pwsh
        run: |
          if ((git -C product rev-parse HEAD) -cne '9b65dd7aedc2eb224755db3d733a7fb19e8e8f62' -or (git -C product rev-parse 'HEAD^{tree}') -cne '3048c4b2c8e5004024191dbb29f5651e5d6bb7e8') { throw 'Wrong SDK product source' }
      - run: npm ci --prefix product/modules/mcp --ignore-scripts
      - name: Anonymous official public feed and six exact asset downloads
        run: node scripts/public-update-020.cjs prepare
      - name: Extract only and verify all packaged resources
        shell: pwsh
        run: |
          $folder = 'artifacts/public-update-020-input'
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          & $sevenZip x (Join-Path $folder 'Creator.Hub_0.1.20_x64-setup.exe') ("-o$folder/extracted") '-y' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          node -e "const p=require('./scripts/public-update-020.cjs');p.assertInstalledResources(require('node:path').resolve('artifacts/public-update-020-input/extracted'),'0.1.20')"
          if ($LASTEXITCODE -ne 0) { throw 'Resource verification failed' }
      - name: Actual public discovery cancellation update restart and new MCP generation
        shell: pwsh
        run: |
          $env:CREATOR_PUBLIC_UPDATE_CONFIG = Join-Path $PWD 'artifacts/public-update-020-input/config.json'
          $env:CREATOR_PUBLIC_BASELINE = Join-Path $PWD 'artifacts/public-update-020-input/Creator.Hub_0.1.19_x64-setup.exe'
          node scripts/native-public-update-020.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native public acceptance failed' }
      - name: Collect bounded original evidence
        if: always()
        run: node scripts/collect-public-update-020.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public020-${{ matrix.case }}
          path: artifacts/public-case/*
          if-no-files-found: error
          retention-days: 14
  evidence:
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: public020-*
          path: evidence
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: hub-public-self-update-020
          path: evidence
          if-no-files-found: error
          retention-days: 14

name: Public Windows 025 to 026 acceptance
on:
  workflow_dispatch:
    inputs:
      expected_harness_commit: {type: string, required: true}
      binding_sha256: {type: string, required: true}
permissions: {contents: read}
jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version: 24}
      - run: npm ci --ignore-scripts
      - run: node --test scripts/public-update-025.test.cjs
  acceptance:
    needs: preflight
    if: github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.ref == 'refs/heads/codex/windows-public-unity-hub-026'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: mcp-restore, tool: mcp, restore: 'true'}
          - {case: setup-restore, tool: setup, restore: 'true'}
          - {case: setup-no-restore, tool: setup, restore: 'false'}
    env:
      EXPECTED_HARNESS_COMMIT: ${{ inputs.expected_harness_commit }}
      CREATOR_PUBLIC_BINDING_SHA256: ${{ inputs.binding_sha256 }}
      CREATOR_OUTGOING_CASE: ${{ matrix.case }}
      CREATOR_OUTGOING_LAST_TOOL: ${{ matrix.tool }}
      CREATOR_OUTGOING_RESTORE: ${{ matrix.restore }}
      CREATOR_SELF_UPDATE_TARGET_VERSION: '0.1.26'
      CREATOR_SELF_UPDATE_INSTALLER_SHA256: '57dc7721d51611a8f26873b3d5f5f9dcab28ac27d5b53e40a43785e10c72b264'
      CREATOR_SELF_UPDATE_EXECUTABLE_SHA256: '15a8b677b3b7e17965248a6f689c16cd01531ebb15dc6984d566c4587f93439a'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version: 24}
      - run: npm ci --ignore-scripts
      - uses: actions/checkout@v6
        with: {ref: f7f2fd17965985de68ac29cc5c2fe3820c8f905f, path: product, persist-credentials: false}
      - shell: pwsh
        run: |
          if ((git -C product rev-parse HEAD) -cne 'f7f2fd17965985de68ac29cc5c2fe3820c8f905f' -or (git -C product rev-parse 'HEAD^{tree}') -cne '4f6026e6a252df8856a3e9ef87ee374eb8da3eb0') { throw 'Product source differs' }
      - run: npm --prefix product/modules/mcp ci --ignore-scripts
      - name: Anonymous public feed and exact assets
        shell: pwsh
        run: |
          node scripts/public-update-025.cjs prepare
          if ($LASTEXITCODE -ne 0) { throw 'Public input admission refused' }
          "CREATOR_PUBLIC_UPDATE_CONFIG=$((Join-Path $PWD artifacts/public-update-025-input/config.json))" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Native public cancel approve automatic and normal restart
        shell: pwsh
        run: |
          node scripts/native-public-update-025.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native public update failed' }
          node scripts/public-evidence-025.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Public evidence refused' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-025-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            artifacts/public-update-025-input/*.json
            artifacts/public-update-025-input/*.minisig
            artifacts/native-suite-*/*.json
            artifacts/native-suite-*/*.toml
            artifacts/native-suite-*/*.png
            artifacts/native-suite-*/sdk-metadata-*/Packages/*.json
            !artifacts/native-suite-*/startup.json

name: Public Windows 027 to 028 acceptance
on:
  workflow_dispatch:
    inputs:
      expected_harness_commit: {type: string, required: true}
      binding_sha256: {type: string, required: true}
      expected_tag_commit: {type: string, required: true}
permissions: {contents: read}
jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version: 24}
      - run: npm ci --ignore-scripts
      - run: node --test scripts/public-update-025.test.cjs
      - run: node scripts/public-update-025.cjs preflight
  acceptance:
    needs: preflight
    if: github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.ref == 'refs/heads/codex/windows-public-028'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: mcp-restore, tool: mcp, restore: 'true'}
          - {case: setup-restore, tool: setup, restore: 'true'}
          - {case: setup-no-restore, tool: setup, restore: 'false'}
    env:
      EXPECTED_HARNESS_COMMIT: ${{ inputs.expected_harness_commit }}
      EXPECTED_TAG_COMMIT: ${{ inputs.expected_tag_commit }}
      CREATOR_PUBLIC_BINDING_SHA256: ${{ inputs.binding_sha256 }}
      CREATOR_OUTGOING_CASE: ${{ matrix.case }}
      CREATOR_OUTGOING_LAST_TOOL: ${{ matrix.tool }}
      CREATOR_OUTGOING_RESTORE: ${{ matrix.restore }}
      CREATOR_SELF_UPDATE_TARGET_VERSION: '0.1.28'
      CREATOR_SELF_UPDATE_INSTALLER_SHA256: '1cb612c8cff49950004d0c429cf4b4ddb9adf2e2821ab72e31e8351490cad1b1'
      CREATOR_SELF_UPDATE_EXECUTABLE_SHA256: '0d0dac1967c65c1f0ba1373949122596825751e87a9a2c27030794d89a6856f8'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version: 24}
      - run: npm ci --ignore-scripts
      - uses: actions/checkout@v6
        with: {ref: 989bccc6d6e204dc581b662d59b2a0f3471b35b1, path: product, persist-credentials: false}
      - shell: pwsh
        run: |
          if ((git rev-parse HEAD) -cne $env:EXPECTED_HARNESS_COMMIT -or $env:GITHUB_SHA -cne $env:EXPECTED_HARNESS_COMMIT) { throw 'Harness source differs' }
          if ((git -C product rev-parse HEAD) -cne '989bccc6d6e204dc581b662d59b2a0f3471b35b1' -or (git -C product rev-parse 'HEAD^{tree}') -cne '834540a1cb1cde1d415d11b0ffdb423c63debb43') { throw 'Product source differs' }
      - run: npm --prefix product/modules/mcp ci --ignore-scripts
      - name: Anonymous public feed and exact assets
        shell: pwsh
        run: |
          node scripts/public-update-025.cjs prepare
          if ($LASTEXITCODE -ne 0) { throw 'Public input admission refused' }
          "CREATOR_PUBLIC_UPDATE_CONFIG=$((Join-Path $PWD artifacts/public-update-025-input/config.json))" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Native public cancel approve automatic and normal restart
        shell: pwsh
        run: |
          node scripts/native-public-update-025.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native public update failed' }
          node scripts/public-evidence-025.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Public evidence refused' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-028-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            artifacts/public-update-025-input/*.json
            artifacts/public-update-025-input/*.minisig
            artifacts/native-suite-*/*.json
            artifacts/native-suite-*/*.toml
            artifacts/native-suite-*/*.png
            artifacts/native-suite-*/sdk-metadata-*/Packages/*.json
            !artifacts/native-suite-*/startup.json

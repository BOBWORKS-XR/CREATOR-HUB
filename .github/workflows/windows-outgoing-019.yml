name: Private Windows 026 to 027 update acceptance
on:
  workflow_dispatch:
    inputs:
      expected_harness_commit: {type: string, required: true}
      binding_sha256: {type: string, required: true}
permissions: {contents: read}
jobs:
  preflight:
    if: github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.ref == 'refs/heads/codex/windows-field-027-win32-wizard'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version: 24}
      - run: npm ci --ignore-scripts
      - run: node --test scripts/hotfix-025-harness.test.cjs
      - name: Parse actual native script
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/native-self-update-outgoing-019.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw 'Native runner parse failed' }
  manual:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 10
    permissions: {contents: write} # Read the private draft assets only.
    strategy:
      fail-fast: false
      matrix: {mode: ['fresh','upgrade']}
    env:
      EXPECTED_HARNESS_COMMIT: ${{ inputs.expected_harness_commit }}
      CREATOR_OUTGOING_REVIEW_SHA256: ${{ inputs.binding_sha256 }}
      CREATOR_OUTGOING_CASE: 'mcp-restore'
      CREATOR_OUTGOING_LAST_TOOL: 'mcp'
      CREATOR_OUTGOING_RESTORE: 'true'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version: 24}
      - run: npm ci --ignore-scripts
      - name: Admit exact installer inputs
        shell: pwsh
        env: {GH_TOKEN: "${{ github.token }}"}
        run: node scripts/windows-outgoing-019-input.cjs acquire
      - name: Run the real Setup wizard
        shell: powershell
        run: ./scripts/Test-ManualInstaller.ps1 -Case '${{ matrix.mode }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-windows-027-${{ matrix.mode }}-${{ github.run_id }}
          path: artifacts/outgoing-019/*.json
          retention-days: 14

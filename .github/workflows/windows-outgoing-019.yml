name: Private Windows Hub 3 registry recheck
on:
  workflow_dispatch:
    inputs:
      expected_harness_commit: {type: string, required: true}
      binding_sha256: {type: string, required: true}
permissions: {contents: read}
jobs:
  preflight:
    if: github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.ref == 'refs/heads/codex/windows-unity-hub-026-registry-recheck'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version: 24}
      - run: npm ci --ignore-scripts
      - run: node --test scripts/hotfix-025-harness.test.cjs
      - name: Parse actual native script
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/native-self-update-outgoing-019.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw 'Native runner parse failed' }
  unity-install-and-cli-registry:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 12
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix: {hub: ['3.21.1']}
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - name: Admit exact disposable test commit
        env: {EXPECTED_HARNESS_COMMIT: '${{ inputs.expected_harness_commit }}'}
        shell: pwsh
        run: if ($env:GITHUB_SHA -cne $env:EXPECTED_HARNESS_COMMIT) { throw 'Wrong smoke test commit' }
      - name: Verify Unity Hub install and independent CLI readback
        shell: pwsh
        run: ./scripts/native-unity-026/Install-PinnedHub.ps1 -Version '${{ matrix.hub }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-cli-registry-${{ matrix.hub }}-${{ github.run_id }}
          retention-days: 14
          path: C:/CreatorHub026RegistryProbe/registry-only.json

name: Signed routing candidate acceptance (not release)
on:
  push:
    branches: [validation/unified-managed-input, validation/unified-managed-014]
    paths: ['.github/workflows/managed-candidate-acceptance.yml']
permissions:
  contents: read
jobs:
  stage-input:
    # GitHub requires push access to read draft assets. Keep that token out of
    # dependency installation and all candidate/native execution jobs.
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Read only the exact private draft asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path managed-native-input | Out-Null
          $zip = 'managed-native-input/managed-candidate.zip'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream'; 'X-GitHub-Api-Version' = '2026-03-10' }
          Invoke-WebRequest -Method Get -Uri 'https://api.github.com/repos/BOBWORKS-XR/CREATOR-HUB/releases/assets/638170425' -Headers $headers -OutFile $zip -MaximumRedirection 5 -TimeoutSec 180
          if ((Get-FileHash $zip).Hash.ToLowerInvariant() -ne '4ef0d46d69e7ecf1d9ffea7d1920a596b439104f1ff5b8e1e26ebc48ce3424ad') { throw 'Managed candidate archive hash differs.' }
      - uses: actions/upload-artifact@v4
        with:
          name: managed-signed-input
          path: managed-native-input/managed-candidate.zip
          retention-days: 7
          if-no-files-found: error
  installed:
    needs: stage-input
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh, upgrade]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm --prefix modules/mcp ci
      - run: npx playwright install chromium
      - uses: actions/download-artifact@v4
        with:
          name: managed-signed-input
          path: artifacts/managed-native-input
      - name: Verify immutable public-only signed routing test input
        shell: pwsh
        run: |
          $zip = 'artifacts/managed-native-input/managed-candidate.zip'
          if ((Get-FileHash $zip).Hash.ToLowerInvariant() -ne '4ef0d46d69e7ecf1d9ffea7d1920a596b439104f1ff5b8e1e26ebc48ce3424ad') { throw 'Managed candidate archive hash differs.' }
          Expand-Archive -LiteralPath $zip -DestinationPath artifacts/managed-native-input/candidate
          $proof = Get-Content artifacts/managed-native-input/candidate/candidate-source.json -Raw | ConvertFrom-Json
          if ($proof.sourceRevision -ne 'c44f9b30cf7ca41c27d66fcd3fb41a562e1dca1f' -or $proof.version -ne '0.1.14' -or $proof.acceptanceOnly -ne $true -or $proof.releaseReady -ne $false -or $proof.privateKeyIncluded -ne $false) { throw 'Unexpected candidate scope.' }
          "CREATOR_CANDIDATE_SOURCE=$($proof.sourceRevision)" >> $env:GITHUB_ENV
      - name: Verify input pins and managed target assertions
        run: node --test scripts/native-managed-target.test.cjs scripts/native-installed-baseline.test.cjs
      - name: Test actual installed signed routing and migration
        run: node scripts/native-builtin-smoke.cjs artifacts/managed-native-input/candidate ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-native-${{ matrix.mode }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: artifacts/native-suite-*/

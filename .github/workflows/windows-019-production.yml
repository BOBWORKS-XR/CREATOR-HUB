name: Windows 019 incoming and same-profile migration (private only)
on:
  push:
    branches: [validation/windows-019-production]
    paths:
      - .github/workflows/windows-019-production.yml
      - scripts/*019*.cjs
      - scripts/*019*.ps1
      - scripts/fixtures/windows-019-binding.json
      - scripts/fixtures/windows-019-test-fixture.cjs
      - scripts/windows-019-*.cjs
      - scripts/windows-019-preflight.ps1
  workflow_dispatch:
    inputs:
      expected_harness_commit:
        type: string
        required: true
      incoming_only:
        description: Recheck failed signed incoming and combined cases; retain completed fresh-native receipt.
        type: boolean
        default: false
      migration_scope:
        description: Select the custom-server gate first or the remaining standard lanes.
        type: choice
        options: [all, custom-server, standard, incoming-only]
        default: all
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.ref == 'refs/heads/validation/windows-019-production'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Parse actual PowerShell and verify lifecycle named parameters without execution
        shell: pwsh
        run: ./scripts/windows-019-preflight.ps1
      - run: node --test scripts/windows-019-harness.test.cjs scripts/windows-019-updater.test.cjs scripts/windows-019-owned-close.test.cjs scripts/windows-019-migration-phase.test.cjs scripts/windows-019-setup-owned-case.test.cjs scripts/windows-019-unverified-server-case.test.cjs scripts/windows-019-baseline-diagnostics.test.cjs
      - name: Inherited guards must pass before native acceptance
        run: node --test --test-concurrency=1 scripts/self-update-baselines.test.cjs scripts/self-update-lab-feed.test.cjs scripts/native-self-update-direct.test.cjs scripts/native-self-update-lab.test.cjs scripts/native-managed-target.test.cjs scripts/native-installed-baseline.test.cjs scripts/native-suite-smoke.test.cjs scripts/native-windows-016-migration.test.cjs
  incoming:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.migration_scope != 'custom-server'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write # Private draft GET access only; no write operations.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.incoming_only && '{"include":[{"case":"incoming12","baseline":"0.1.12"},{"case":"incoming14","baseline":"0.1.14"},{"case":"incoming18","baseline":"0.1.18"}]}' || '{"include":[{"case":"fresh","baseline":"0.1.12"},{"case":"incoming12","baseline":"0.1.12"},{"case":"incoming14","baseline":"0.1.14"},{"case":"incoming18","baseline":"0.1.18"}]}') }}
    env:
      EXPECTED_HARNESS_COMMIT: ${{ inputs.expected_harness_commit }}
      CREATOR_WINDOWS_019_PRODUCTION: '1'
      CREATOR_PRODUCTION_019_BASELINE: ${{ matrix.baseline }}
    steps:
      - name: Require exact reviewed harness before checkout
        shell: pwsh
        run: |
          if ($env:EXPECTED_HARNESS_COMMIT -cnotmatch '^[a-f0-9]{40}$' -or $env:EXPECTED_HARNESS_COMMIT -cne $env:GITHUB_SHA) { throw 'Wrong harness source.' }
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Refuse pending pins before product checkout or native work
        id: pins
        shell: pwsh
        run: |
          node -e "const fs=require('node:fs');const c=require('./scripts/windows-019-production.cjs');c.assertHost();fs.appendFileSync(process.env.GITHUB_OUTPUT,'source='+c.SOURCE.commit+'\ntree='+c.SOURCE.tree+'\n')"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed 019 binding unavailable.' }
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pins.outputs.source }}
          path: product
          persist-credentials: false
      - name: Bind exact MCP client source tree
        shell: pwsh
        run: |
          if ((git -C product rev-parse HEAD) -cne '${{ steps.pins.outputs.source }}' -or (git -C product rev-parse 'HEAD^{tree}') -cne '${{ steps.pins.outputs.tree }}') { throw 'Wrong product source.' }
      - run: npm --prefix product/modules/mcp ci --ignore-scripts
      - name: Acquire four exact signed production data files from the private draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/windows-019-acquire.cjs
      - name: Stage unchanged exact public baseline
        if: matrix.case != 'fresh'
        shell: pwsh
        run: |
          node -e "const c=require('./scripts/windows-019-production.cjs');process.stdout.write(JSON.stringify(c.BASELINE))" | Set-Content baseline.json -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw 'Baseline pin lookup failed.' }
          $baseline=Get-Content baseline.json -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri "https://github.com/BOBWORKS-XR/CREATOR-HUB/releases/download/v$($baseline.version)/$($baseline.asset)" -OutFile baseline.exe -TimeoutSec 180
          if ((Get-FileHash baseline.exe).Hash.ToLowerInvariant() -cne $baseline.installer) { throw 'Published baseline changed.' }
      - name: Actual signed update and automatic restart with production metadata
        if: matrix.case != 'fresh'
        shell: pwsh
        run: |
          $parameters=@{ContractPath=(Join-Path $PWD artifacts/production-019-control/config.json);BaselineInstallerPath=(Join-Path $PWD baseline.exe);TimeoutSeconds=480}
          & ./scripts/native-self-update-lab-019.ps1 @parameters | Tee-Object artifacts/production-019-control/lifecycle.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Production incoming lifecycle failed.' }
      - name: Fresh native pages, equivalent settings and normal restart
        if: matrix.case == 'fresh'
        run: node scripts/native-windows-019-fresh.cjs "${{ github.workspace }}/artifacts/incoming-019/candidate/Creator.Hub_0.1.19_x64-setup.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-019-production-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/incoming-019/input-binding.json
            artifacts/production-019-control/*.json*
            artifacts/native-suite-*/*.json
            artifacts/native-suite-*/*.png
            !artifacts/native-suite-*/startup.json
  incoming-migration:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.migration_scope != 'incoming-only'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        migration_case: ${{ fromJSON(inputs.migration_scope == 'custom-server' && '["setup-owned-codex-unverified-server"]' || inputs.migration_scope == 'standard' && '["legacy","setup-owned-codex"]' || '["legacy","setup-owned-codex","setup-owned-codex-unverified-server"]') }}
    permissions:
      contents: write # Private draft GET access only; no write operations.
    env:
      WINDOWS_MIGRATION_CASE: ${{ matrix.migration_case }}
      EXPECTED_HARNESS_COMMIT: ${{ inputs.expected_harness_commit }}
      CREATOR_WINDOWS_019_PRODUCTION: '1'
      CREATOR_PRODUCTION_019_BASELINE: '0.1.12'
    steps:
      - name: Require exact reviewed harness before checkout
        shell: pwsh
        run: |
          if ($env:EXPECTED_HARNESS_COMMIT -cnotmatch '^[a-f0-9]{40}$' -or $env:EXPECTED_HARNESS_COMMIT -cne $env:GITHUB_SHA) { throw 'Wrong harness source.' }
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Refuse pending pins before product checkout or native work
        id: pins
        shell: pwsh
        run: |
          node -e "const fs=require('node:fs');const c=require('./scripts/windows-019-production.cjs');c.assertHost();fs.appendFileSync(process.env.GITHUB_OUTPUT,'source='+c.SOURCE.commit+'\ntree='+c.SOURCE.tree+'\n')"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed 019 binding unavailable.' }
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pins.outputs.source }}
          path: product
          persist-credentials: false
      - name: Bind exact MCP client source tree
        shell: pwsh
        run: |
          if ((git -C product rev-parse HEAD) -cne '${{ steps.pins.outputs.source }}' -or (git -C product rev-parse 'HEAD^{tree}') -cne '${{ steps.pins.outputs.tree }}') { throw 'Wrong product source.' }
      - run: npm --prefix product/modules/mcp ci --ignore-scripts
      - name: Acquire identical four signed production files
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/windows-019-acquire.cjs
      - name: Stage original Hub12 MCP2.7.7 and Setup0.3.7 installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/legacy-baselines | Out-Null
          node -e "process.stdout.write(JSON.stringify(require('./scripts/native-installed-baseline.cjs').baselines))" | Set-Content artifacts/legacy-baselines.json -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw 'Baseline lookup failed.' }
          foreach($b in (Get-Content artifacts/legacy-baselines.json -Raw | ConvertFrom-Json)) {
            $file=Join-Path $PWD "artifacts/legacy-baselines/$($b.asset)"
            Invoke-WebRequest -Uri "https://github.com/BOBWORKS-XR/$($b.repo)/releases/download/v$($b.version)/$($b.asset)" -OutFile $file -TimeoutSec 180
            if ((Get-FileHash $file).Hash.ToLowerInvariant() -cne $b.sha256) { throw 'Original baseline differs.' }
          }
      - name: Same synthetic profile signed update then native merge and restart
        shell: pwsh
        run: |
          foreach($entry in @(Get-ChildItem Env:)) {
            if ($entry.Name -match '^(?i:CREATOR_|WEBVIEW2_|NODE_OPTIONS$|NODE_PATH$|NODE_TLS_REJECT_UNAUTHORIZED$|NODE_EXTRA_CA_CERTS$|SSL_CERT_FILE$|SSL_CERT_DIR$|CURL_CA_BUNDLE$|REQUESTS_CA_BUNDLE$|ALL_PROXY$|HTTP_PROXY$|HTTPS_PROXY$)') { Remove-Item -LiteralPath "Env:$($entry.Name)" }
          }
          $env:CREATOR_WINDOWS_019_MIGRATION='1'
          $env:INCOMING_EXPECTED_SOURCE=$env:GITHUB_SHA
          node -e "require('./scripts/native-windows-019-migration.cjs').productionMigrationMain(process.argv.slice(1)).catch(e=>{console.error(e.message);process.exitCode=1})" (Join-Path $PWD artifacts/incoming-019/candidate) (Join-Path $PWD artifacts/legacy-baselines)
          if ($LASTEXITCODE -ne 0) { throw 'Same-profile incoming and migration failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-019-production-migration-${{ matrix.migration_case }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/incoming-019/input-binding.json
            artifacts/production-019-control/*.json
            artifacts/native-suite-*/*.json
            artifacts/native-suite-*/*.jsonl
            artifacts/native-suite-*/baseline-diagnostic-*/result.json
            artifacts/native-suite-*/*.png
            !artifacts/native-suite-*/startup.json

name: Private actual017 Linux update fixture (never publication)
on:
  push:
    branches: [validation/linux-private-update-fixture-017]
  workflow_dispatch:
    inputs:
      signed_input:
        description: Exact JSON {assetId,zipBytes,zipSha256,planSha256} for the reviewed signed017 derivation ZIP
        required: true
        type: string
      plan:
        description: Exact canonical approved private017 plan JSON; its SHA256 must match signed_input and the ZIP
        required: true
        type: string
permissions:
  contents: read
jobs:
  stage-input:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/linux-private-update-fixture-017' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Draft download only: never checkout, decode candidates or install dependencies with this token.
    permissions:
      contents: write
    steps:
      - name: Validate the independent plan and download only the exact private signed ZIP
        uses: actions/github-script@v8
        env:
          SIGNED_INPUT: ${{ inputs.signed_input }}
          APPROVED_PLAN: ${{ inputs.plan }}
        with:
          script: |
            const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
            assert.equal(context.repo.owner,'BOBWORKS-XR');assert.equal(context.repo.repo,'CREATOR-HUB');
            assert.equal(process.env.GITHUB_REPOSITORY_ID,'1364807512');assert.equal(context.eventName,'workflow_dispatch');
            assert.equal(context.ref,'refs/heads/validation/linux-private-update-fixture-017');
            assert.equal(process.env.RUNNER_ENVIRONMENT,'github-hosted');assert.equal(process.env.RUNNER_OS,'Linux');assert.equal(process.env.RUNNER_ARCH,'X64');
            const input=process.env.SIGNED_INPUT,planText=process.env.APPROVED_PLAN;
            assert.ok(typeof input==='string'&&Buffer.byteLength(input)<=1024);
            assert.ok(typeof planText==='string'&&Buffer.byteLength(planText)>0&&Buffer.byteLength(planText)<=128*1024);
            const p=JSON.parse(input),plan=JSON.parse(planText);
            assert.deepEqual(Object.keys(p).sort(),['assetId','planSha256','zipBytes','zipSha256']);
            assert.equal(input,JSON.stringify(p));assert.equal(planText,JSON.stringify(plan,null,2));
            for(const key of ['assetId','zipBytes'])assert.ok(Number.isSafeInteger(p[key])&&p[key]>0);
            assert.ok(p.zipBytes<=1024*1024*1024);
            for(const key of ['zipSha256','planSha256'])assert.match(p[key],/^[a-f0-9]{64}$/);
            const hash=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
            assert.equal(hash(Buffer.from(planText)),p.planSha256);
            assert.equal(plan.schemaVersion,1);assert.equal(plan.product,'com.creatorworks.hub.private017-derived-handoff');
            assert.equal(plan.hubVersion,'0.1.17');assert.equal(plan.platform,'linux');assert.equal(plan.arch,'x86_64');
            assert.match(context.sha,/^[a-f0-9]{40}$/);assert.equal(plan.rootSource.sourceCommit,context.sha);assert.match(plan.rootSource.sourceTree,/^[a-f0-9]{40}$/);
            assert.equal(plan.acceptanceOnly,true);
            for(const key of ['nativeGuiAccepted','migrationAccepted','authenticationAccepted','signedUpdateAccepted','restartAccepted','releaseReady'])assert.equal(plan[key],false);
            const {data:release}=await github.rest.repos.getRelease({...context.repo,release_id:411494394});
            assert.equal(release.id,411494394);assert.equal(release.draft,true);assert.equal(release.tag_name,'v0.1.13-validation');
            const {data:assets}=await github.rest.repos.listReleaseAssets({...context.repo,release_id:release.id,per_page:100,page:1});
            assert.ok(Array.isArray(assets)&&assets.length<100,'Bounded complete private asset listing required');
            const rows=assets.filter(asset=>asset.id===p.assetId);assert.equal(rows.length,1);const asset=rows[0];
            assert.equal(asset.name,`signed-private-linux-update-fixture-017-${context.sha}.zip`);assert.equal(asset.state,'uploaded');
            assert.equal(asset.size,p.zipBytes);assert.equal(asset.digest,`sha256:${p.zipSha256}`);
            const {data}=await github.rest.repos.getReleaseAsset({...context.repo,asset_id:p.assetId,headers:{accept:'application/octet-stream'}});
            assert.ok(Buffer.isBuffer(data)||data instanceof ArrayBuffer);const bytes=Buffer.from(data);
            assert.equal(bytes.length,p.zipBytes);assert.equal(hash(bytes),p.zipSha256);
            const temp=fs.realpathSync(process.env.RUNNER_TEMP);
            for(const [name,body] of [['private017-signed.zip',bytes],['approved-plan.json',planText],['signed-input.json',input]])fs.writeFileSync(path.join(temp,name),body,{flag:'wx',mode:0o600});
      - uses: actions/upload-artifact@v4
        with:
          name: private017-signed-input-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/private017-signed.zip
            ${{ runner.temp }}/approved-plan.json
            ${{ runner.temp }}/signed-input.json
  assemble:
    needs: stage-input
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/linux-private-update-fixture-017' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    env:
      CREATOR_LINUX_PRIVATE_UPDATE_FIXTURE_017: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: private017-signed-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/private017-download
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: npm
      - name: Install locked JavaScript dependencies without hooks before pure imports
        run: npm ci --ignore-scripts
      - name: Pure wrapper regressions and syntax before native dependencies
        run: |
          node --test scripts/private-linux-update-fixture-017.test.cjs scripts/private-linux-update-fixture-017-metadata.test.cjs scripts/private-linux-update-fixture-017-assemble.test.cjs scripts/sign-private-linux-update-fixture-017.test.cjs
          python3 -B scripts/stage-private-linux-update-fixture-017.test.py
          python3 -B scripts/private-linux-update-fixture-017-package-verify.test.py
      - name: Stage only the pinned017 data and inspect all input contracts before installation
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path'),{execFileSync}=require('node:child_process');
          const fixture=require('./scripts/private-linux-update-fixture-017.cjs'),assembly=require('./scripts/private-linux-update-fixture-017-assemble.cjs');
          fixture.context('linux','x86_64',process.env);fixture.versions(process.cwd());
          const temp=fs.realpathSync(process.env.RUNNER_TEMP),download=path.join(temp,'private017-download');
          const profile=JSON.parse(fs.readFileSync(path.join(download,'signed-input.json'),'utf8'));
          execFileSync('/usr/bin/python3',['-B','scripts/stage-private-linux-update-fixture-017.py',path.join(download,'private017-signed.zip'),profile.zipSha256,String(profile.zipBytes),path.join(download,'approved-plan.json'),profile.planSha256,path.join(temp,'private017-input')],{stdio:'inherit',timeout:180000});
          const checked=assembly.inputs(path.join(temp,'private017-input'),profile.planSha256);
          assert.equal(checked.plan.rootSource.sourceCommit,process.env.GITHUB_SHA);checked.recheck();
          fs.appendFileSync(process.env.GITHUB_ENV,`CREATOR_UNIX_HANDOFF_SHA256=${checked.plan.original016['handoff.json'].sha256}\nPRIVATE017_PLAN_SHA256=${profile.planSha256}\n`);
          NODE
      - name: Independently refresh original producer and baseline/actual017 source API proof
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path');
            const assembly=require('./scripts/private-linux-update-fixture-017-assemble.cjs'),provenance=require('./scripts/private-linux-update-fixture-017-provenance.cjs');
            const temp=fs.realpathSync(process.env.RUNNER_TEMP),checked=assembly.inputs(path.join(temp,'private017-input'),process.env.PRIVATE017_PLAN_SHA256);
            const fresh=await provenance.fresh({plan:checked.plan,handoff:checked.handoff,preparedFile:checked.files['prepared-unix.json']},async route=>(await github.request(`GET /repos/BOBWORKS-XR/CREATOR-HUB/${route}`)).data);
            checked.recheck();fs.writeFileSync(path.join(temp,'private017-fresh-api.json'),JSON.stringify(fresh,null,2),{flag:'wx',mode:0o600});
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> ../artifacts/unix-verifier-target
            native/unix-transfer
          cache-on-failure: true
      - name: Provision trusted build prerequisites only after all data-only gates pass
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev librsvg2-dev build-essential file patchelf
          npm ci
          node --test scripts/private-linux-update-fixture-017-workflow.test.cjs
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify all five signatures and build only actual017 Root and a new DEB
        run: |
          temp=$(python3 -B -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')
          node scripts/private-linux-update-fixture-017-assemble.cjs --root "$GITHUB_WORKSPACE" --input "$temp/private017-input" --output "$GITHUB_WORKSPACE/artifacts/unified/private-linux-update-fixture-017" --plan-sha256 "$PRIVATE017_PLAN_SHA256"
      - name: Retain only exact private017 package/byte proofs, never publish or certify acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-linux-update-fixture-017-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/private017-fresh-api.json
            artifacts/unified/private-linux-update-fixture-017/private017-assembly.json
            artifacts/unified/private-linux-update-fixture-017/private017-package-expected.json
            artifacts/unified/private-linux-update-fixture-017/builtin-manifest.json
            artifacts/unified/private-linux-update-fixture-017/modules.tar.gz
            artifacts/unified/private-linux-update-fixture-017/creator-hub
            artifacts/unified/private-linux-update-fixture-017/unix-package-integrity.json
            artifacts/unified/private-linux-update-fixture-017/native-packages/*.deb

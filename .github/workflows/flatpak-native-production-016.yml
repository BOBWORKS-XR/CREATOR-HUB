name: Production 016 manual Flatpak launcher bundle (not acceptance)

on:
  push:
    branches: [validation/linux-flatpak-production-016]
  workflow_dispatch:
    inputs:
      source_pins:
        description: Exact production-native-activation-016 source commit/tree and all fixed source/key/Cargo/icon/license size and SHA256 pins. No paths, commands or profile overrides.
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/linux-flatpak-production-016'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      SOURCE_PINS: ${{ inputs.source_pins }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
      - name: Standard-library preflight before any dependency installation
        run: node scripts/flatpak-native-production-016.cjs preflight
      - name: Bind independent source tree to the actual repository API
        uses: actions/github-script@v8
        with:
          script: |
            const lane = require(require('node:path').join(process.env.GITHUB_WORKSPACE, 'scripts/flatpak-native-production-016.cjs'));
            await lane.collect(github, context);
      - name: Install source test dependencies without npm hooks
        run: npm ci --ignore-scripts
      - name: Check both packaging profiles and production workflow before compilation
        run: |
          node --check scripts/flatpak-native-production-016.cjs
          node --test scripts/flatpak-native-production-016.test.cjs scripts/flatpak-native-production-016-workflow.test.cjs scripts/flatpak-native-activation.test.cjs
      - name: Provision native launcher compilation and data-only export tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev \
            flatpak ostree desktop-file-utils
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Compile only the pinned launcher; export, bundle and independently inspect data
        run: node scripts/flatpak-native-production-016.cjs package
      - name: Retain the manual bundle and independent launcher/inspection receipt
        uses: actions/upload-artifact@v4
        with:
          name: linux-016-production-flatpak-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ runner.temp }}/flatpak-native-production-016/output/Creator.Hub_0.1.16_x86_64.flatpak
            ${{ runner.temp }}/flatpak-native-production-016/output/creator-hub-flatpak-activate
            ${{ runner.temp }}/flatpak-native-production-016/output/production-flatpak-receipt.json
      - name: Retain bounded refusal evidence only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-016-production-flatpak-refusal-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/flatpak-native-production-016/input-binding.json
            ${{ runner.temp }}/flatpak-native-production-016/output/production-flatpak-refusal.json

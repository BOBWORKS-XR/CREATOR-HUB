name: Windows candidate

on:
  push:
    branches: [ui-preview]
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Reuse an existing candidate run for native acceptance only
        required: false
        type: string
      staged_setup:
        description: Use the reviewed signed Setup draft cache instead of asserting public Setup discovery
        required: false
        type: boolean
        default: false
      staged_mcp:
        description: Use the reviewed signed MCP draft cache instead of public MCP discovery
        required: false
        type: boolean
        default: false
      release_version:
        description: Test the exact Windows installer asset from a tagged draft release
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: ${{ !inputs.candidate_run }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CREATOR_SETUP_SOURCE: ${{ github.workspace }}/.test-fixtures/setup/src
      CREATOR_MCP_SOURCE: ${{ github.workspace }}/.test-fixtures/mcp/launcher/src
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read accepted app source revisions
        id: apps
        shell: pwsh
        run: |
          $pins = Get-Content scripts/prerelease-apps.json -Raw | ConvertFrom-Json
          "setup=$($pins.setup.sourceRevision)" >> $env:GITHUB_OUTPUT
          "mcp=$($pins.mcp.sourceRevision)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v6
        with:
          repository: BOBWORKS-XR/CREATOR-PROJECT-SETUP
          ref: ${{ steps.apps.outputs.setup }}
          path: .test-fixtures/setup
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: BOBWORKS-XR/CREATOR-WORKS-UNITY-MCP
          ref: ${{ steps.apps.outputs.mcp }}
          path: .test-fixtures/mcp
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: npm ci
      - name: Require the latest companion releases to match reviewed signed descriptors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-companion-release-metadata.cjs
      - run: node --test scripts/*.test.cjs
      - run: npx playwright install chromium
      - name: Hub interface tests
        run: npm run test:ui
      - name: Rust tests
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust lint
        run: cargo clippy --release --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Build and verify installer candidate
        shell: powershell
        run: .\scripts\Build-WindowsCandidate.ps1 -HostedPins scripts/prerelease-apps.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-hub-windows-candidate
          path: |
            dist/Creator-Hub-*-Windows-Candidate/
            test-results/
            artifacts/companion-release-preflight.json
            artifacts/installer-guard-*/report.json
          if-no-files-found: error

  stage_setup:
    needs: build
    if: ${{ always() && (inputs.staged_setup || inputs.staged_mcp) && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.candidate_run != '')) }}
    runs-on: windows-latest
    timeout-minutes: 5
    # Draft visibility needs push access. Keep this token out of jobs that run apps.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch the exact draft fixture without executing it
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_SETUP: ${{ inputs.staged_setup && '1' || '' }}
          STAGED_MCP: ${{ inputs.staged_mcp && '1' || '' }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $pins = Get-Content scripts/prerelease-apps.json -Raw | ConvertFrom-Json
          foreach ($app in @('setup', 'mcp')) {
            if ([Environment]::GetEnvironmentVariable("STAGED_$($app.ToUpperInvariant())") -ne '1') { continue }
            $pin = $pins.$app
            $folder = "artifacts/staged-$app"
            gh release download "v$version" --repo BOBWORKS-XR/CREATOR-HUB --pattern $pin.assetName --dir $folder
            if ($LASTEXITCODE -ne 0) { throw 'Staged installer download failed.' }
            $file = Join-Path $folder $pin.assetName
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.installerSha256) { throw 'Staged installer hash differs.' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-staged-app-installers
          path: |
            artifacts/staged-setup/*.exe
            artifacts/staged-mcp/*.exe
          if-no-files-found: error

  native-suite:
    needs: [build, stage_setup]
    if: ${{ always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.candidate_run != '')) && (!(inputs.staged_setup || inputs.staged_mcp) || needs.stage_setup.result == 'success') }}
    name: Native suite (${{ matrix.baseline }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        baseline: [clean, legacy, mcp-only, latest-hub]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: creator-hub-windows-candidate
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run || github.run_id }}
      - name: Download and verify the exact tagged release installer
        if: ${{ inputs.release_version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:REQUESTED_RELEASE_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$' -or $env:REQUESTED_RELEASE_VERSION -ne $version) { throw 'Release version must match this checkout.' }
          $folder = 'artifacts/release-installer'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          gh release download "v$version" --repo BOBWORKS-XR/CREATOR-HUB --pattern "Creator.Hub_${version}_x64-setup.exe" --pattern SHA256SUMS.txt --dir $folder
          if ($LASTEXITCODE -ne 0) { throw 'Tagged release installer download failed.' }
          $assetName = "Creator.Hub_${version}_x64-setup.exe"
          $expected = (Get-Content (Join-Path $folder 'SHA256SUMS.txt') | Where-Object { $_ -match ("  " + [regex]::Escape($assetName) + '$') } | ForEach-Object { ($_ -split '\s+')[0] })
          if (@($expected).Count -ne 1) { throw 'Release checksum entry is missing or ambiguous.' }
          $installer = Join-Path $folder $assetName
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Release installer differs from its published checksum.' }
          "CREATOR_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install the exact tested Hub package
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $baseline = if ('${{ matrix.baseline }}' -eq 'clean') { 'clean' } elseif ('${{ matrix.baseline }}' -eq 'legacy') { 'alpha.5' } elseif ('${{ matrix.baseline }}' -eq 'latest-hub') { 'stable-0.1.8' } else { 'alpha.3' }
          $releaseInstaller = if ($env:CREATOR_RELEASE_VERSION -eq $version) { 'artifacts\release-installer\Creator.Hub_' + $version + '_x64-setup.exe' } else { '' }
          .\scripts\Test-InstalledCandidate.ps1 -CandidateDirectory "dist\Creator-Hub-$version-Windows-Candidate" -HubBaseline $baseline -ExternalInstallerPath $releaseInstaller
      - name: Download the verified staged app fixtures from this test run
        if: ${{ inputs.staged_setup || inputs.staged_mcp }}
        uses: actions/download-artifact@v4
        with:
          name: accepted-staged-app-installers
          path: artifacts
      - name: Stage signed Setup cache for native verification
        if: ${{ inputs.staged_setup }}
        run: node scripts/stage-setup-cache.cjs
      - name: Stage signed MCP cache for native verification
        if: ${{ inputs.staged_mcp }}
        run: node scripts/stage-setup-cache.cjs mcp
      - name: Test native installs and both hosted applications
        env:
          CREATOR_SUITE_BASELINE: ${{ matrix.baseline }}
          CREATOR_STAGED_SETUP: ${{ inputs.staged_setup && '1' || '' }}
          CREATOR_STAGED_MCP: ${{ inputs.staged_mcp && '1' || '' }}
        run: node scripts/native-suite-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-suite-${{ matrix.baseline }}
          path: |
            artifacts/native-suite-*/report.json
            artifacts/native-suite-*/*.png
            artifacts/native-suite-*/*dialogs.json
            artifacts/native-suite-*/*startup.json
            artifacts/native-suite-*/webview-policy.json
            artifacts/native-suite-*/mcp-picker.json
            artifacts/staged-setup/receipt.json
            artifacts/staged-mcp/receipt.json
            dist/Creator-Hub-*-Windows-Candidate/installed-acceptance.json
          if-no-files-found: error

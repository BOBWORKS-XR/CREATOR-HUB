name: Maintenance signed Windows update lab
on:
  push:
    branches: [fix/hub-013-platform-flatpak]
    paths: [.github/workflows/maintenance-signed-update-lab.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  update:
    if: github.repository == 'BOBWORKS-XR/CREATOR-HUB'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Bind the exact accepted separate-app candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $run = gh api repos/BOBWORKS-XR/CREATOR-HUB/actions/runs/38423123336 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.head_sha -ne '288d3d60a8108d6ff41729b63705af3598721f60' -or $run.repository.full_name -ne 'BOBWORKS-XR/CREATOR-HUB') { throw 'Accepted Windows candidate run differs.' }
          $artifact = gh api repos/BOBWORKS-XR/CREATOR-HUB/actions/artifacts/11828292672 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.expired -or $artifact.name -ne 'creator-hub-windows-candidate' -or $artifact.workflow_run.id -ne 38423123336 -or $artifact.digest -ne 'sha256:1fddb5c51ae92f3d1e7dd92792569fa5f4c70f378e269153e8f4f3f6db4631cc') { throw 'Accepted candidate artifact differs.' }
      - uses: actions/download-artifact@v4
        with:
          name: creator-hub-windows-candidate
          run-id: 38423123336
          github-token: ${{ github.token }}
          path: artifacts/accepted-candidate
      - name: Stage exact public inputs before enabling the owned lab proxy
        shell: pwsh
        run: |
          $root = Join-Path $PWD artifacts/maintenance-signed-lab
          $candidate = Join-Path $root candidate
          New-Item -ItemType Directory -Path $candidate | Out-Null
          $accepted = Join-Path $PWD artifacts/accepted-candidate/dist/Creator-Hub-0.1.13-Windows-Candidate
          $installer = Join-Path $accepted Creator-Hub-0.1.13-Windows-setup.exe
          $exe = Join-Path $accepted extracted/creator-hub.exe
          if ((Get-FileHash -LiteralPath $installer).Hash.ToLowerInvariant() -ne 'bbdc390ba49526c9bdd40efa373c7e7d292b68ebe7209fb31aa4c833bc2805cb' -or
              (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant() -ne '2b2c8f5014d121f7ef408caab6626d14dc73b9f716b321ec9c1177ebe5c4a3ca') { throw 'Exact accepted installed payload differs.' }
          Copy-Item -LiteralPath $installer -Destination (Join-Path $candidate Creator.Hub_0.1.13_x64-setup.exe)
          foreach ($name in @('creator-hub-windows-x86_64.json','creator-hub-windows-x86_64.json.minisig','latest.json')) {
            Copy-Item -LiteralPath (Join-Path $PWD ('tests/fixtures/maintenance-signed-update/' + $name)) -Destination (Join-Path $candidate $name)
          }
          $config = @{ schemaVersion=1; targetVersion='0.1.13'; directory=$candidate; pins=@{
            descriptor='8e937241dc55a1871f1eff2a447c8797a1092e9209b8a9e760771772f43eb971'
            descriptorSignature='4badb69f01275b7616db9c0cf95826cafcc54ae63d69004a65d8b515bc5b8c2b'
            installer='bbdc390ba49526c9bdd40efa373c7e7d292b68ebe7209fb31aa4c833bc2805cb'
            manifest='017287c53c3616bc1b3477c7a3631362714818098f030a8cce8dd94e642c59fd'
            executable='2b2c8f5014d121f7ef408caab6626d14dc73b9f716b321ec9c1177ebe5c4a3ca'
          }}
          $config | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $root lab-config.json) -Encoding utf8NoBOM
          node -e "const f=require('fs');require('./scripts/self-update-lab-feed.cjs').loadContract(JSON.parse(f.readFileSync(process.argv[1],'utf8')));console.log('Pinned signed inputs validated; not updater acceptance.');" (Join-Path $root lab-config.json)
          if ($LASTEXITCODE -ne 0) { throw 'Signed input contract refused.' }
          $pins = Get-Content scripts/prerelease-apps.json -Raw | ConvertFrom-Json
          foreach ($app in @('setup','mcp')) {
            $pin = $pins.$app
            $repo = if ($app -eq 'setup') { 'CREATOR-PROJECT-SETUP' } else { 'CREATOR-WORKS-UNITY-MCP' }
            $file = Join-Path $candidate $pin.assetName
            Invoke-WebRequest -Uri "https://github.com/BOBWORKS-XR/$repo/releases/download/v$($pin.version)/$($pin.assetName)" -OutFile $file -TimeoutSec 180
            if ((Get-FileHash -LiteralPath $file).Hash.ToLowerInvariant() -ne $pin.installerSha256) { throw 'Pinned separate companion installer differs.' }
          }
          Invoke-WebRequest -Uri 'https://github.com/BOBWORKS-XR/CREATOR-HUB/releases/download/v0.1.12/Creator.Hub_0.1.12_x64-setup.exe' -OutFile (Join-Path $root baseline.exe) -TimeoutSec 180
          if ((Get-FileHash -LiteralPath (Join-Path $root baseline.exe)).Hash.ToLowerInvariant() -ne '0cd8a4493dd9a5b77fbc5fe160582a2b2698fea43aedd9118b2d5b3bd3c51a18') { throw 'Unmodified public baseline differs.' }
      - name: Refusal and lifecycle unit checks
        run: node --test scripts/native-self-update-lab.test.cjs scripts/self-update-lab-feed.test.cjs scripts/self-update-lab-target.test.cjs scripts/maintenance-signed-update.test.cjs
      - name: Actual native signed cancellation, update, restart and reopened separate views
        shell: pwsh
        run: |
          ./scripts/native-self-update-lab.ps1 -ContractPath (Join-Path $PWD artifacts/maintenance-signed-lab/lab-config.json) -BaselineInstallerPath (Join-Path $PWD artifacts/maintenance-signed-lab/baseline.exe) -TimeoutSeconds 480 | Tee-Object -FilePath artifacts/maintenance-signed-lab/lifecycle-public-metadata.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Native signed update lifecycle failed.' }
          $reports = @(Get-ChildItem -LiteralPath artifacts -Directory | Where-Object { $_.Name -like 'native-suite-*' } | ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -File -Filter self-update-report.json })
          if ($reports.Count -ne 1) { throw 'Expected one actual native update report.' }
          $receipt = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if ($receipt.passed -ne $true -or $receipt.selfUpdateTested -ne $true -or $receipt.hostedViewsUpdateTested -ne $true -or $receipt.policyRestored -ne $true -or $receipt.publicDiscovery -ne $false -or $receipt.releaseReady -ne $false -or $receipt.releaseLine -ne 'separate-apps') { throw 'Actual signed update receipt is incomplete.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-signed-update-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/native-suite-*/self-update-report.json
            artifacts/native-suite-*/*.png
            artifacts/native-suite-*/startup.json
            artifacts/native-suite-*/dialogs.json
            artifacts/native-suite-*/webview-policy.json
            artifacts/maintenance-signed-lab/lifecycle-public-metadata.jsonl
            artifacts/maintenance-signed-lab/lab-config.json

name: Production 016 to private 017 native update qualification

on:
  push:
    branches: [validation/native-linux-production-016-update]
  workflow_dispatch:
    inputs:
      profile:
        description: Independent exact final016 and private017 source/API/ZIP/member pins; no policy or key overrides
        required: true
        type: string
      profile_sha256:
        description: SHA256 of the exact profile text; no fallback baseline
        required: true
        type: string
      scenario:
        description: One finite scenario per fresh disposable runner
        required: true
        type: choice
        options:
          - deb-native-cancel
          - deb-auth-cancel
          - deb-approve
          - portable-native-cancel
          - portable-approve
          - portable-flatpak-approve
      execute_update:
        description: Allow this one disposable runner's native installation and selected update actions
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  stage-input:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/native-linux-production-016-update' &&
      github.workflow_ref == 'BOBWORKS-XR/CREATOR-HUB/.github/workflows/native-linux-production-016-update.yml@refs/heads/validation/native-linux-production-016-update' &&
      inputs.execute_update == true
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Download exact existing private draft data only; no checkout, extraction or candidate execution
        uses: actions/github-script@v8
        env:
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_PROFILE_SHA256: ${{ inputs.profile_sha256 }}
          INPUT_SCENARIO: ${{ inputs.scenario }}
        with:
          script: |
            const assert = require('node:assert/strict'), fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
            const raw = Buffer.from(process.env.INPUT_PROFILE), sha = b => crypto.createHash('sha256').update(b).digest('hex');
            assert.ok(raw.length > 0 && raw.length <= 65536); assert.equal(sha(raw), process.env.INPUT_PROFILE_SHA256);
            const p = JSON.parse(raw), scenario = process.env.INPUT_SCENARIO;
            assert.ok(['deb-native-cancel','deb-auth-cancel','deb-approve','portable-native-cancel','portable-approve','portable-flatpak-approve'].includes(scenario));
            assert.equal(p.profile, 'production016-private017-native-update'); assert.equal(p.schemaVersion, 1);
            assert.equal(p.fromVersion, '0.1.16'); assert.equal(p.toVersion, '0.1.17');
            const roles = scenario.startsWith('deb-') ? ['signedDeb17'] : ['signedPortable16','signedPortable17'];
            assert.deepEqual(Object.keys(p.deliveries).sort(), roles.slice().sort());
            const fixedName = role => role === 'signedDeb17' ? 'signed-private-deb017-carrier-39352480021.zip'
              : `signed-private-portable0${role.slice(-2)}-carrier-${p.artifacts['portable'+role.slice(-2)].run}.zip`;
            const dir = path.join(process.env.RUNNER_TEMP, 'production016-update-data-only'); fs.mkdirSync(dir, {mode: 0o700});
            const release = (await github.rest.repos.getRelease({owner:'BOBWORKS-XR',repo:'CREATOR-HUB',release_id:411494394})).data;
            assert.equal(release.id,411494394); assert.equal(release.tag_name,'v0.1.13-validation'); assert.equal(release.draft,true);
            const listing = (await github.rest.repos.listReleaseAssets({owner:'BOBWORKS-XR',repo:'CREATOR-HUB',release_id:411494394,per_page:100,page:1})).data;
            assert.ok(Array.isArray(listing) && listing.length < 100, 'Complete bounded private asset inventory required');
            const assets = {};
            for (const role of roles) {
              const e = p.deliveries[role]; assert.deepEqual(Object.keys(e).sort(),['asset','files','name','zip']);
              assert.ok(Number.isSafeInteger(e.asset) && e.asset > 0); assert.equal(e.name,fixedName(role));
              assert.ok(Number.isSafeInteger(e.zip.size) && e.zip.size > 0 && e.zip.size <= 768*1024*1024 && /^[a-f0-9]{64}$/.test(e.zip.sha256));
              if (role === 'signedDeb17') { assert.equal(e.asset,658078066); assert.equal(e.zip.size,64362879); assert.equal(e.zip.sha256,'252f14b4b119412d4c0017b18479077c3050228f17725464688545a5fd298a6f'); }
              const found = listing.filter(a => a.id === e.asset && a.name === e.name); assert.equal(found.length,1);
              const a = (await github.rest.repos.getReleaseAsset({owner:'BOBWORKS-XR',repo:'CREATOR-HUB',asset_id:e.asset})).data;
              assert.equal(a.id,e.asset); assert.equal(a.name,e.name); assert.equal(a.size,e.zip.size); assert.equal(a.state,'uploaded'); assert.equal(a.digest,'sha256:'+e.zip.sha256);
              const response = await github.rest.repos.getReleaseAsset({owner:'BOBWORKS-XR',repo:'CREATOR-HUB',asset_id:e.asset,headers:{accept:'application/octet-stream'}});
              const bytes = Buffer.from(response.data); assert.equal(bytes.length,e.zip.size); assert.equal(sha(bytes),e.zip.sha256);
              fs.writeFileSync(path.join(dir,role+'.zip'),bytes,{flag:'wx',mode:0o600});
              assets[role] = {asset:e.asset,name:e.name,zip:e.zip};
            }
            const receipt = {schemaVersion:1,release:411494394,tag:'v0.1.13-validation',profileSha256:process.env.INPUT_PROFILE_SHA256,
              harnessSource:context.sha,run:context.runId,attempt:Number(process.env.GITHUB_RUN_ATTEMPT),assets,dataOnly:true,
              publicDiscovery:false,flatpakAccepted:false,steamDeckAccepted:false,liveAiAccepted:false,unityAccepted:false,releaseReady:false};
            const sorted = x => Array.isArray(x) ? x.map(sorted) : x && typeof x === 'object' ? Object.fromEntries(Object.keys(x).sort().map(k=>[k,sorted(x[k])])) : x;
            fs.writeFileSync(path.join(dir,'delivery-proof.json'),JSON.stringify(sorted(receipt),null,2)+'\n',{flag:'wx',mode:0o600});
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: native-linux-production-016-update-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/production016-update-data-only/*
  update:
    needs: stage-input
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/native-linux-production-016-update' &&
      github.workflow_ref == 'BOBWORKS-XR/CREATOR-HUB/.github/workflows/native-linux-production-016-update.yml@refs/heads/validation/native-linux-production-016-update' &&
      inputs.execute_update == true
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      UPDATE_EXECUTE: ${{ inputs.execute_update }}
      UPDATE_SCENARIO: ${{ inputs.scenario }}
      UPDATE_PROFILE_SHA256: ${{ inputs.profile_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pure tests, workflow parsing and clean system Python parity before downloads
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S -c 'import sys; assert sys.version_info[:2] == (3, 10)'
          /usr/bin/python3 -I -S -B scripts/native-linux-production-016-update.py preflight-import
          /usr/bin/python3 -I -S -B scripts/native-linux-production-016-update.test.py
          /usr/bin/python3 -I -S -B scripts/native-linux-update-mcp.test.py
          /usr/bin/python3 -I -S -B scripts/native-linux-update-flatpak.test.py
          /usr/bin/python3 -I -S -B scripts/native-linux-production-016-migration.test.py
          node --test scripts/native-linux-production-016-flatpak.test.cjs scripts/flatpak-native-production-016.test.cjs
          printf 'CONTROLLER_NODE=%s\n' "$(realpath "$(command -v node)")" >> "$GITHUB_ENV"
      - name: Stage the migration fixture's locked MCP SDK without lifecycle hooks
        run: npm ci --prefix modules/mcp --ignore-scripts --no-audit --no-fund
      - name: Bind independent profile and fresh API identities before downloading data
        uses: actions/github-script@v8
        env:
          UPDATE_PROFILE: ${{ inputs.profile }}
          INPUT_ARTIFACT: ${{ needs.stage-input.outputs.artifact }}
        with:
          retries: 0
          script: |
            const assert = require('node:assert/strict'), fs = require('node:fs'), path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const script = path.join(process.env.GITHUB_WORKSPACE, 'scripts/native-linux-production-016-update.py');
            const run = (mode, input, timeout = 30000) => execFileSync('/usr/bin/python3', ['-I', '-S', '-B', script, mode], {env: process.env, stdio: 'pipe', input, timeout});
            run('profile');
            const root = path.join(process.env.RUNNER_TEMP, 'native-linux-production-016-update');
            const profile = JSON.parse(fs.readFileSync(path.join(root, 'profile.json'))), proof = {};
            assert.equal(context.sha, process.env.GITHUB_SHA);
            for (const [role, expected] of Object.entries(profile.artifacts)) {
              const runApi = (await github.rest.actions.getWorkflowRun({owner: 'BOBWORKS-XR', repo: 'CREATOR-HUB', run_id: expected.run})).data;
              const job = (await github.rest.actions.getJobForWorkflowRun({owner: 'BOBWORKS-XR', repo: 'CREATOR-HUB', job_id: expected.job})).data;
              const artifact = (await github.rest.actions.getArtifact({owner: 'BOBWORKS-XR', repo: 'CREATOR-HUB', artifact_id: expected.artifact})).data;
              const commit = (await github.rest.git.getCommit({owner: 'BOBWORKS-XR', repo: 'CREATOR-HUB', commit_sha: expected.source})).data;
              proof[role] = {run: runApi, job, artifact, commit};
            }
            if (process.env.UPDATE_SCENARIO === 'portable-flatpak-approve') {
              const source = profile.flatpakLauncher.source;
              proof.flatpakSource = (await github.rest.git.getCommit({owner:'BOBWORKS-XR',repo:'CREATOR-HUB',commit_sha:source.sourceCommit})).data;
              assert.equal(proof.flatpakSource.sha,source.sourceCommit); assert.equal(proof.flatpakSource.tree.sha,source.sourceTree);
            }
            assert.ok(/^[1-9][0-9]*$/.test(process.env.INPUT_ARTIFACT));
            const encode = value => { const bytes = Buffer.from(JSON.stringify(value)); assert.ok(bytes.length <= 512 * 1024); return bytes; };
            const now = () => Number(process.hrtime.bigint()) / 1e6, deadline = now() + 30000;
            const remaining = () => { const ms = Math.floor(deadline - now()); assert.ok(ms > 0, 'Current-run API observation deadline'); return ms; };
            const headers = value => Object.fromEntries(Object.entries(value || {}).filter(([k, v]) =>
              ['date', 'etag', 'last-modified', 'cache-control', 'age', 'vary', 'via', 'x-cache', 'x-cache-hits', 'x-github-request-id'].includes(k.toLowerCase())
              && typeof v === 'string' && v.length <= 1024).map(([k, v]) => [k.toLowerCase(), v]));
            const observations = path.join(process.env.RUNNER_TEMP, 'native-linux-production-016-update-api-observations'); fs.mkdirSync(observations, {mode: 0o700});
            let firstIdentity;
            // These are refusal bounds, not a presumed GitHub consistency window. No sleeps or API-error retries.
            for (let index = 1; index <= 6; index++) {
              const observation = {index, startedAt: new Date().toISOString(), startedMs: now(), requests: [], responses: {}, producerProof: proof, decision: 'refused'};
              let candidate, state, phase = 'run';
              const get = async (label, method, params) => {
                phase = label;
                const request = {label, startedAt: new Date().toISOString(), startedMs: now(), timeoutMs: Math.min(5000, remaining())};
                observation.requests.push(request);
                try {
                  const response = await method({owner: 'BOBWORKS-XR', repo: 'CREATOR-HUB', ...params,
                    request: {signal: AbortSignal.timeout(request.timeoutMs)}});
                  request.status = response.status; request.headers = headers(response.headers);
                  assert.equal(response.status, 200, 'Current-run API response status');
                  encode(response.data); observation.responses[label] = response.data;
                  assert.ok(now() - request.startedMs < request.timeoutMs, 'Current-run API GET deadline');
                  remaining(); assert.ok(response.data && typeof response.data === 'object' && !Array.isArray(response.data), 'Malformed current-run API response');
                  return response.data;
                } catch (error) {
                  request.failed = true;
                  if (Number.isInteger(error.status)) request.status = error.status;
                  if (error.response) request.headers = headers(error.response.headers);
                  throw new Error('Current-run API read refused: ' + label);
                } finally {
                  request.finishedAt = new Date().toISOString(); request.finishedMs = now();
                }
              };
              try {
                const runApi = await get('run', github.rest.actions.getWorkflowRun, {run_id: context.runId});
                phase = 'run-identity'; run('api-run-observe', encode(runApi), Math.min(5000, remaining())); remaining();
                const listing = await get('jobs', github.rest.actions.listJobsForWorkflowRun, {run_id: context.runId, filter: 'latest', per_page: 100});
                assert.ok(Number.isInteger(listing.total_count) && listing.total_count < 100 && Array.isArray(listing.jobs) && listing.jobs.length === listing.total_count);
                const stages = listing.jobs.filter(j => j.name === 'stage-input'), current = listing.jobs.filter(j => j.name === 'update');
                assert.equal(stages.length, 1); assert.equal(current.length, 1);
                for (const job of [stages[0], current[0]]) {
                  assert.ok(Number.isSafeInteger(job.id) && job.id > 0);
                  assert.equal(job.run_id, context.runId); assert.equal(job.run_attempt, Number(process.env.GITHUB_RUN_ATTEMPT)); assert.equal(job.head_sha, context.sha);
                }
                assert.ok(['queued', 'in_progress'].includes(current[0].status) && current[0].conclusion === null, 'Current job is terminal or malformed');
                const artifact = await get('artifact', github.rest.actions.getArtifact, {artifact_id: Number(process.env.INPUT_ARTIFACT)});
                assert.equal(artifact.id, Number(process.env.INPUT_ARTIFACT));
                const identity = {stage: stages[0].id, current: current[0].id, artifact: [artifact.id, artifact.name, artifact.digest, artifact.size_in_bytes, artifact.workflow_run]};
                if (firstIdentity) assert.deepEqual(identity, firstIdentity, 'Current-run API observation identity drift');
                candidate = {...proof, private: {run: runApi, job: stages[0], artifact}};
                phase = 'all-guards'; state = JSON.parse(run('api-observe', encode(candidate), Math.min(5000, remaining()))).state;
                remaining(); assert.ok(['queued', 'in_progress'].includes(state));
                firstIdentity = identity;
                observation.decision = state === 'queued' ? 'queued-not-admitted' : 'strict-validation';
              } finally {
                observation.phase = phase; observation.finishedAt = new Date().toISOString(); observation.finishedMs = now();
                const bytes = Buffer.from(JSON.stringify(observation)); assert.ok(bytes.length <= 2 * 1024 * 1024);
                fs.writeFileSync(path.join(observations, String(index).padStart(2, '0') + '.json'), bytes, {flag: 'wx', mode: 0o600});
              }
              remaining();
              if (state === 'in_progress') {
                fs.writeFileSync(path.join(root, 'api.json'), encode(candidate), {flag: 'wx', mode: 0o600});
                run('api', undefined, Math.min(5000, remaining())); remaining();
                return;
              }
            }
            throw new Error('Current-run API observation cap reached; queued was not admitted');
      - name: Download only the already API-bound immutable artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const assert = require('node:assert/strict'), fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
            const root = path.join(process.env.RUNNER_TEMP, 'native-linux-production-016-update');
            const profile = JSON.parse(fs.readFileSync(path.join(root, 'profile.json')));
            const proof = JSON.parse(fs.readFileSync(path.join(root, 'api.json')));
            const sha = b => crypto.createHash('sha256').update(b).digest('hex');
            assert.equal(sha(fs.readFileSync(path.join(root, 'profile.json'))), process.env.UPDATE_PROFILE_SHA256);
            for (const [role, expected] of Object.entries(profile.artifacts)) {
              const result = await github.rest.actions.downloadArtifact({owner: 'BOBWORKS-XR', repo: 'CREATOR-HUB', artifact_id: expected.artifact, archive_format: 'zip'});
              const bytes = Buffer.from(result.data);
              assert.equal(bytes.length, expected.zip.size); assert.equal(sha(bytes), expected.zip.sha256);
              fs.writeFileSync(path.join(root, role + '.zip'), bytes, {flag: 'wx', mode: 0o600});
            }
            const a = proof.private.artifact;
            const result = await github.rest.actions.downloadArtifact({owner:'BOBWORKS-XR',repo:'CREATOR-HUB',artifact_id:a.id,archive_format:'zip'});
            const bytes = Buffer.from(result.data); assert.equal(bytes.length,a.size_in_bytes); assert.equal('sha256:'+sha(bytes),a.digest);
            fs.writeFileSync(path.join(root,'carrier.zip'),bytes,{flag:'wx',mode:0o600});
      - name: Bind the original launcher sources only for the combined scenario
        if: inputs.scenario == 'portable-flatpak-approve'
        uses: actions/github-script@v8
        with:
          retries: 0
          script: |
            const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
            const root=path.join(process.env.RUNNER_TEMP,'native-linux-production-016-update');
            const profile=JSON.parse(fs.readFileSync(path.join(root,'profile.json'))),source=profile.flatpakLauncher.source;
            const sha=(kind,b)=>crypto.createHash(kind).update(b).digest('hex');
            assert.equal(Object.keys(source.files).length,12);
            const destination=path.join(root,'flatpak-source');fs.mkdirSync(destination,{mode:0o700});
            for(const [name,pin] of Object.entries(source.files)) {
              assert.match(name,/^[A-Za-z0-9_.\/-]+$/);assert.ok(!name.split('/').some(p=>!p||p==='.'||p==='..'));
              const item=(await github.rest.repos.getContent({owner:'BOBWORKS-XR',repo:'CREATOR-HUB',path:name,ref:source.sourceCommit})).data;
              assert.equal(item.type,'file');assert.equal(item.path,name);assert.equal(item.encoding,'base64');assert.equal(item.size,pin.size);
              const body=Buffer.from(item.content,'base64');assert.equal(body.length,pin.size);assert.equal(sha('sha256',body),pin.sha256);
              assert.equal(sha('sha1',Buffer.concat([Buffer.from(`blob ${body.length}\0`),body])),item.sha);
              const target=path.join(destination,name);fs.mkdirSync(path.dirname(target),{recursive:true,mode:0o700});
              fs.writeFileSync(target,body,{flag:'wx',mode:0o600});
            }
      - name: Decode only the complete current-run carrier; every original ZIP and member remains independently pinned
        run: /usr/bin/python3 -I -S -B scripts/native-linux-production-016-update.py carrier
      - name: Install only declared disposable native qualification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 webkit2gtk-driver libayatana-appindicator3-1 libgtk-3-0 libxdo3 libxres1 librsvg2-2 \
            python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 gir1.2-gdkpixbuf-2.0 at-spi2-core dbus-x11 xvfb xauth openbox fonts-dejavu-core \
            libpam-systemd openssl ca-certificates policykit-1-gnome=0.105-7ubuntu3 pkexec=0.105-33ubuntu0.2 \
            polkitd=0.105-33ubuntu0.2 coreutils=8.32-4.1ubuntu1.4 passwd=1:4.8.1-2ubuntu2.2
          sudo systemctl start systemd-logind.service polkit.service
      - name: Provision only the combined lane's Flatpak inspection tools
        if: inputs.scenario == 'portable-flatpak-approve'
        run: sudo apt-get install -y --no-install-recommends flatpak ostree xdg-desktop-portal xdg-desktop-portal-gtk desktop-file-utils
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Verify genuine GI error binding and typed read-only conversion before UI
        run: /usr/bin/python3 -I -B scripts/native-linux-production-016-update.test.py GenuineGiBinding
      - name: Build pinned HTML attachment tooling only for the three DEB lanes
        if: inputs.scenario == 'deb-native-cancel' || inputs.scenario == 'deb-auth-cancel' || inputs.scenario == 'deb-approve'
        run: cargo install tauri-driver --version 2.1.0 --locked --root "$RUNNER_TEMP/native-linux-production-016-driver"
      - name: Build only the shared locked offline verifier, with source, production key, compiler and fresh executable evidence
        run: /usr/bin/python3 -I -S -B scripts/native-linux-production-016-update.py verifier
      - name: Verify production signatures, complete archive inventories and native DEB contents without execution
        run: /usr/bin/python3 -I -S -B scripts/native-linux-production-016-update.py stage
      - name: Verify stock system authorization policy without changing it
        run: /usr/bin/python3 -I -S -B scripts/native-linux-production-016-update.py stock-policy
      - name: One fixed broker and native scenario; no product builds or manual successor
        run: |
          /usr/bin/python3 -I -S -B - <<'PY'
          import importlib.util, os, subprocess
          from pathlib import Path
          source = Path('scripts/native-linux-production-016-update.py').resolve()
          spec = importlib.util.spec_from_file_location('update016', source)
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          m.admission(os.environ)
          values = [key + '=' + os.environ[key] for key in m.ENVIRONMENT]
          subprocess.run(['/usr/bin/sudo', '-n', '/usr/bin/env', '-i', *values, 'PATH=/usr/bin:/bin', 'LANG=C', 'LC_ALL=C',
                          '/usr/bin/python3', '-B', str(source), 'broker'], stdin=subprocess.DEVNULL, check=True)
          PY
      - name: Verify owned temporary trust cleanup, including an interrupted broker
        if: always()
        run: |
          /usr/bin/python3 -I -S -B - <<'PY'
          import importlib.util, os, subprocess
          from pathlib import Path
          source = Path('scripts/native-linux-production-016-update.py').resolve()
          spec = importlib.util.spec_from_file_location('update016', source)
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          values = [key + '=' + os.environ[key] for key in m.ENVIRONMENT if key in os.environ]
          subprocess.run(['/usr/bin/sudo', '-n', '/usr/bin/env', '-i', *values, 'PATH=/usr/bin:/bin', 'LANG=C', 'LC_ALL=C',
                          '/usr/bin/python3', '-B', str(source), 'tls-cleanup'], stdin=subprocess.DEVNULL, check=True)
          PY
      - name: Export only fixed bounded synthetic evidence; never ephemeral TLS or credentials
        if: always()
        run: |
          /usr/bin/python3 -I -S -B - <<'PY'
          import importlib.util, os, subprocess
          from pathlib import Path
          source = Path('scripts/native-linux-production-016-update.py').resolve()
          spec = importlib.util.spec_from_file_location('update016', source)
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          values = [key + '=' + os.environ[key] for key in m.ENVIRONMENT if key in os.environ]
          subprocess.run(['/usr/bin/sudo', '-n', '/usr/bin/env', '-i', *values, 'PATH=/usr/bin:/bin', 'LANG=C', 'LC_ALL=C',
                          '/usr/bin/python3', '-B', str(source), 'export'], stdin=subprocess.DEVNULL, check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux-production-016-update-${{ inputs.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-linux-production-016-update/profile.json
            ${{ runner.temp }}/native-linux-production-016-update/api.json
            ${{ runner.temp }}/native-linux-production-016-update-api-observations/
            ${{ runner.temp }}/native-linux-production-016-update/request.json
            ${{ runner.temp }}/native-linux-production-016-update/review.json
            ${{ runner.temp }}/native-linux-production-016-verifier/receipt.json
            ${{ runner.temp }}/native-linux-production-016-update-evidence/

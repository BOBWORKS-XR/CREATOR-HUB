name: R7 017 raw fresh and guarded installer (no release signatures)
on:
  push:
    branches: [validation/windows-menu-merge-20261027]
    paths:
      - .github/workflows/windows-r5-raw-installer.yml
      - scripts/windows-r5-raw.cjs
      - scripts/windows-r5-raw.test.cjs
      - scripts/windows-artifact-candidate.cjs
      - scripts/windows-artifact-install.cjs
      - scripts/fixtures/windows-r5-raw-binding.json
  workflow_dispatch:
    inputs:
      expected_harness_commit:
        type: string
        required: true
      release_id:
        type: string
        required: true
      release_tag:
        type: string
        required: true
      asset_id:
        type: string
        required: true
      asset_name:
        type: string
        required: true
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.ref == 'refs/heads/validation/windows-menu-merge-20261027'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test scripts/windows-r5-raw.test.cjs
  install:
    needs: preflight
    if: github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/windows-menu-merge-20261027'
    permissions:
      contents: write # Existing private-draft GET API requires this; no write calls.
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh, guarded]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      EXPECTED_HARNESS_COMMIT: ${{ inputs.expected_harness_commit }}
      CREATOR_WINDOWS_ARTIFACT_INSTALL: '1'
      CREATOR_WINDOWS_R5_RAW_INSTALL: '1'
    steps:
      - name: Require reviewed workflow commit before checkout
        shell: pwsh
        run: |
          if ($env:EXPECTED_HARNESS_COMMIT -cnotmatch '^[a-f0-9]{40}$' -or $env:EXPECTED_HARNESS_COMMIT -cne $env:GITHUB_SHA) { throw 'Harness source differs.' }
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Refuse missing R5 pins before network or native actions
        run: node scripts/windows-r5-raw.cjs preflight
      - name: GET only the exact private R7 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_ID: ${{ inputs.asset_id }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($id in @($env:RELEASE_ID, $env:ASSET_ID)) { if ($id -cnotmatch '^[1-9][0-9]{0,15}$') { throw 'Fixed positive ID required.' } }
          foreach ($name in @($env:RELEASE_TAG, $env:ASSET_NAME)) { if ($name -cnotmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,159}$' -or $name.Contains('..')) { throw 'Exact safe name required.' } }
          $pins = Get-Content -LiteralPath scripts/fixtures/windows-r5-raw-binding.json -Raw | ConvertFrom-Json
          if ($pins.enabled -ne $true -or $pins.version -cne '0.1.18') { throw 'R7 pins unavailable.' }
          $headers = @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2026-03-10'}
          $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/BOBWORKS-XR/CREATOR-HUB/releases/$env:RELEASE_ID" -Headers $headers -TimeoutSec 30
          if ($release.id.ToString() -cne $env:RELEASE_ID -or $release.tag_name -cne $env:RELEASE_TAG -or $release.draft -ne $true -or $release.prerelease -ne $true) { throw 'Private draft identity differs.' }
          $assets = @($release.assets | Where-Object { $_.id.ToString() -ceq $env:ASSET_ID })
          if ($assets.Count -ne 1 -or $assets[0].name -cne $env:ASSET_NAME -or $assets[0].state -cne 'uploaded' -or $assets[0].size -ne $pins.installer.bytes -or $assets[0].digest -cne "sha256:$($pins.installer.sha256)") { throw 'Exact installer asset differs.' }
          if (Test-Path -LiteralPath raw-input) { throw 'Raw input already exists; no clobber.' }
          New-Item -ItemType Directory -Path raw-input | Out-Null
          $download = @{Authorization="Bearer $env:GH_TOKEN";Accept='application/octet-stream';'X-GitHub-Api-Version'='2026-03-10'}
          $file = Join-Path $PWD 'raw-input/Creator.Hub_0.1.18_x64-setup.exe'
          Invoke-WebRequest -Method Get -Uri "https://api.github.com/repos/BOBWORKS-XR/CREATOR-HUB/releases/assets/$env:ASSET_ID" -Headers $download -OutFile $file -MaximumRedirection 5 -TimeoutSec 180
          if ((Get-Item -LiteralPath $file).Length -ne $pins.installer.bytes -or (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pins.installer.sha256) { throw 'Downloaded installer differs.' }
          @{schemaVersion=1;releaseId=[long]$env:RELEASE_ID;releaseTag=$env:RELEASE_TAG;assetId=[long]$env:ASSET_ID;assetName=$env:ASSET_NAME;bytes=$pins.installer.bytes;sha256=$pins.installer.sha256;receiptSha256=$pins.buildResultSha256} | ConvertTo-Json | Set-Content -LiteralPath private-input-binding.json -Encoding utf8NoBOM
      - run: npm ci --ignore-scripts
      - name: Exact installer-only fresh or public14 guarded case
        run: node scripts/windows-r5-raw.cjs ${{ matrix.mode }} raw-input private-input-binding.json installer-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-r5-raw-${{ matrix.mode }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            private-input-binding.json
            installer-evidence/installer-report.json

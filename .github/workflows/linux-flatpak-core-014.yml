name: Linux Flatpak Core compile and private activation contract

on:
  workflow_dispatch:
  push:
    branches: [validation/linux-flatpak-core-014]
    paths:
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/src/main.rs
      - src-tauri/src/flatpak_rpc.rs
      - src-tauri/src/flatpak_bootstrap.rs
      - .github/workflows/linux-flatpak-core-014.yml

permissions:
  contents: read

jobs:
  core-contract:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/linux-flatpak-core-014' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-flatpak-core-014
      - name: Install native compilation dependencies only
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev librsvg2-dev build-essential dbus
      - name: Compile both isolated Linux roles and reject warnings
        run: |
          set -euo pipefail
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --tests --features experimental-flatpak-host -- -D warnings
          cargo check --locked --manifest-path src-tauri/Cargo.toml --features experimental-flatpak-ui
      - name: Typed RPC and fixed bootstrap interface tests
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features experimental-flatpak-host flatpak_rpc::tests -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features experimental-flatpak-host flatpak_bootstrap::tests::activation_has_one_method_and_no_arguments_or_properties -- --exact
      - name: Actual private session bus activation without host settings or commands
        run: |
          set -euo pipefail
          dbus-run-session -- env CREATOR_FLATPAK_BOOTSTRAP_TEST=1 \
            cargo test --locked --manifest-path src-tauri/Cargo.toml --features experimental-flatpak-host \
            flatpak_bootstrap::tests::native_activation_round_trip_has_no_host_operation_arguments -- --exact --ignored --test-threads=1

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    # Accepted candidate releases must not be rebuilt or have their assets replaced.
    # Retain the stable exclusions.
    if: ${{ !contains(' v0.1.0 v0.1.1 v0.1.2 v0.1.3 v0.1.4 v0.1.5 v0.1.6 v0.1.7 ', format(' {0} ', github.ref_name)) }}
    name: Package ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            args: --bundles nsis
          - os: ubuntu-22.04
            label: Linux
            args: --bundles appimage,deb,rpm
          - os: macos-latest
            label: macOS Apple silicon
            args: --bundles dmg
          - os: macos-15-intel
            label: macOS Intel
            args: --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file \
            rpm
      - run: npm ci
      - name: Use a canonical temporary path for macOS test fixtures
        if: runner.os == 'macOS'
        shell: bash
        run: echo "TMPDIR=$(node -p "require('fs').realpathSync(require('os').tmpdir())")" >> "$GITHUB_ENV"
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: 1
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: Creator Hub __VERSION__
          releaseBody: Creator Hub desktop application. Draft release generated by multiplatform packaging workflow.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  checksums:
    if: ${{ !contains(' v0.1.0 v0.1.1 v0.1.2 v0.1.3 v0.1.4 v0.1.5 v0.1.6 v0.1.7 ', format(' {0} ', github.ref_name)) }}
    name: Consolidate SHA256 checksums
    runs-on: ubuntu-latest
    needs: [package]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Compute consolidated checksums and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          max_attempts=5
          for attempt in $(seq 1 $max_attempts); do
            if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets > release-assets.json &&
               node scripts/release-checksums.mjs release-assets.json > SHA256SUMS.txt; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Release asset query returned empty after $max_attempts attempts." >&2
              exit 1
            fi
            delay=$((5 * 2 ** (attempt - 1)))
            echo "Release asset query attempt $attempt empty; retrying in $delay seconds..." >&2
            sleep $delay
          done

          for attempt in $(seq 1 $max_attempts); do
            if gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber --repo "${{ github.repository }}"; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Release checksum upload failed after $max_attempts attempts." >&2
              exit 1
            fi
            delay=$((5 * 2 ** (attempt - 1)))
            echo "Release checksum upload attempt $attempt failed; retrying in $delay seconds..." >&2
            sleep $delay
          done

          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets --jq '.assets[] | "\(.apiUrl) \(.name)"' | while read -r asset_api_url asset_name; do
            label=""
            case "$asset_name" in
              *.exe)
                label="Creator-Hub-${VERSION}-windows-x64-setup.exe"
                ;;
              *aarch64.dmg)
                label="Creator-Hub-${VERSION}-macos-arm64.dmg"
                ;;
              *x64.dmg)
                label="Creator-Hub-${VERSION}-macos-x64.dmg"
                ;;
              *.dmg)
                label="Creator-Hub-${VERSION}-macos.dmg"
                ;;
              *.AppImage)
                label="Creator-Hub-${VERSION}-linux-x86_64.AppImage"
                ;;
              *.deb)
                label="Creator-Hub-${VERSION}-linux-amd64.deb"
                ;;
              *.rpm)
                label="Creator-Hub-${VERSION}-1-linux.x86_64.rpm"
                ;;
            esac
            if [ -n "$label" ]; then
              gh api -X PATCH "$asset_api_url" -f label="$label" >/dev/null
            fi
          done

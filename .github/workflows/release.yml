name: Validate Qualified Windows Draft (No Rebuild)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualified-windows-draft:
    if: ${{ ((github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || github.event_name == 'workflow_dispatch') && github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      # Private draft GETs require this scope. This job has no release write commands.
      contents: write
      actions: read
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify finite validation-only child of the immutable release
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/windows-018-release-recheck' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $association = '15d21076eb2e1504f19ca786979365ae174d008b'
          $parent = (git show -s --format=%P HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $parent -cne $association) { throw 'Validation must directly parent immutable association15d.' }
          $allowed = @('.github/workflows/release.yml', 'scripts/windows-release-qualification.test.cjs')
          $changed = @(git diff --name-only $association HEAD)
          if ($LASTEXITCODE -ne 0 -or @(Compare-Object ($allowed | Sort-Object) ($changed | Sort-Object)).Count -ne 0) { throw 'Unexpected validation checkout delta.' }
          $tag = gh api repos/BOBWORKS-XR/CREATOR-HUB/git/ref/tags/v0.1.18 --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $tag.Trim() -cne $association) { throw 'Immutable release tag differs.' }
          $digest = (Get-FileHash -LiteralPath packaging/windows/0.1.18-qualification.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne '2684e9a0b0e885f5cb4a6e0d91a7aef4900a60e8f3989e15f2ecb41789e03e9e') { throw 'Qualification bytes differ.' }
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Acquire exact staged installer for signature regression tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release download v0.1.20 --repo BOBWORKS-XR/CREATOR-HUB --pattern Creator.Hub_0.1.20_x64-setup.exe --dir artifacts/qualification-assets
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the exact staged installer.' }
          $digest = (Get-FileHash artifacts/qualification-assets/Creator.Hub_0.1.20_x64-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne '2915ffac9b1c39f5facbd4030eb6addf837e0d414b96835e0f0be1564577666b') { throw 'Staged installer hash differs.' }
          gh release download v0.1.21 --repo BOBWORKS-XR/CREATOR-HUB --pattern Creator.Hub_0.1.21_x64-setup.exe --dir artifacts/qualification-assets
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the exact staged 0.1.21 installer.' }
          $digest = (Get-FileHash artifacts/qualification-assets/Creator.Hub_0.1.21_x64-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne '09dd6563e5e93a533f7ddedc600c785f56d123f55d1e29a8eada6ab3941cf2b3') { throw 'Staged 0.1.21 installer hash differs.' }
      - name: Test qualification, refusal, Windows scope and legacy feed controls
        env:
          QUALIFICATION_020_ASSETS: ${{ github.workspace }}/artifacts/qualification-assets
          QUALIFICATION_021_ASSETS: ${{ github.workspace }}/artifacts/qualification-assets
        run: node --test scripts/windows-release-qualification.test.cjs scripts/windows-release-target.test.cjs scripts/windows-016-release-qualification.test.cjs scripts/windows-017-draft-stage.test.cjs scripts/windows-018-public-acceptance.test.cjs scripts/windows-019-public-acceptance.test.cjs scripts/windows-019-reader-alignment.test.cjs scripts/check-unified-sources.test.cjs scripts/publish-hub-draft.test.cjs scripts/release-checksums.test.mjs scripts/check-release-feed.test.cjs scripts/release-workflow.test.cjs scripts/release-platform-scope.test.cjs scripts/release-ref.test.cjs scripts/self-update-baselines.test.cjs scripts/windows-020-release-qualification.test.cjs scripts/windows-020-public-acceptance.test.cjs scripts/windows-020-publisher.test.cjs scripts/windows-021-release-qualification.test.cjs scripts/windows-021-public-acceptance.test.cjs scripts/windows-021-publisher.test.cjs
      - name: Validate immutable qualified draft without building or publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -ceq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag differs from the checked-out package version.' }
          # Create the final tag while the qualified release is still a clean draft.
          $targetVersion = node -p "require('./scripts/windows-release-target.cjs').getTarget().version"
          if ($LASTEXITCODE -ne 0) { throw 'Release target metadata is unavailable.' }
          if ($version -in @('0.1.20', '0.1.21')) {
            $receipt = "packaging/windows/$version-qualification.json"
            $digest = (Get-Content -LiteralPath "$receipt.sha256" -Raw).Trim()
            if ($digest -cnotmatch '^[a-f0-9]{64}$') { throw 'Reviewed receipt digest is missing or invalid.' }
            node scripts/check-unified-sources.cjs --release --version "$version" --platform windows-x86_64 --receipt "$receipt" --sha256 "$digest" --association "$env:GITHUB_SHA" --verify-draft
          } elseif ($version -ceq $targetVersion) {
            $receipt = "packaging/windows/$version-qualification.json"
            $digest = (Get-Content -LiteralPath "$receipt.sha256" -Raw).Trim()
            if ($digest -cnotmatch '^[a-f0-9]{64}$') { throw 'Reviewed final receipt digest is missing or invalid.' }
            if ($env:GITHUB_EVENT_NAME -ceq 'workflow_dispatch' -and $env:GITHUB_REF -ceq 'refs/heads/validation/windows-018-release-recheck') {
              node scripts/check-unified-sources.cjs --release --version "$version" --platform windows-x86_64 --receipt "$receipt" --sha256 "$digest" --association 15d21076eb2e1504f19ca786979365ae174d008b --verify-draft
            } else {
              node scripts/check-unified-sources.cjs --release --version "$version" --platform windows-x86_64 --receipt "$receipt" --sha256 "$digest" --association "$env:GITHUB_SHA" --verify-draft
            }
          } elseif ($version -ceq '0.1.14') {
            $receipt = 'packaging/windows/0.1.14-qualification.json'
            node scripts/check-unified-sources.cjs --release --version "$version" --platform windows-x86_64 --receipt "$receipt" --verify-draft
          } else { throw 'This version has no reviewed Windows qualification route.' }
          if ($LASTEXITCODE -ne 0) { throw 'Exact Windows qualification or current remote evidence refused.' }
          node scripts/check-release-feed.cjs "$version" --draft
          if ($LASTEXITCODE -ne 0) { throw 'Legacy public-client feed budget refused.' }
          # Publication is a separate parent-reviewed guarded publisher invocation.
          # No latest/ready claim precedes actual post-publication old-client acceptance.

name: CI

on:
  push:
    branches: ["ui-preview", "master", "workflow*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend & script tests
    runs-on: ubuntu-22.04
    env:
      CREATOR_SETUP_SOURCE: ${{ github.workspace }}/.test-fixtures/setup/src
      CREATOR_MCP_SOURCE: ${{ github.workspace }}/.test-fixtures/mcp/launcher/src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Read accepted app source revisions
        id: apps
        run: |
          node -e '
            const pins = JSON.parse(require("fs").readFileSync("scripts/prerelease-apps.json", "utf8"));
            console.log(`setup=${pins.setup.sourceRevision}`);
            console.log(`mcp=${pins.mcp.sourceRevision}`);
          ' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: BOBWORKS-XR/CREATOR-PROJECT-SETUP
          ref: ${{ steps.apps.outputs.setup }}
          path: .test-fixtures/setup
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: BOBWORKS-XR/CREATOR-WORKS-UNITY-MCP
          ref: ${{ steps.apps.outputs.mcp }}
          path: .test-fixtures/mcp
          persist-credentials: false
      - run: npm ci
      - run: npm run test:scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  hub-windows:
    name: Hub (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - name: Build Windows release binary and NSIS bundle
        run: npm run build -- --bundles nsis

  hub-linux:
    name: Hub (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file \
            rpm
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - name: Build Linux AppImage, DEB, and RPM bundle
        run: NO_STRIP=1 npm run build -- --bundles appimage,deb,rpm

  hub-macos:
    name: Hub (macOS ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Apple silicon
          - os: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Use a canonical temporary path for macOS test fixtures
        shell: bash
        run: echo "TMPDIR=$(node -p "require('fs').realpathSync(require('os').tmpdir())")" >> "$GITHUB_ENV"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - name: Build macOS DMG bundle
        run: npm run build -- --bundles dmg

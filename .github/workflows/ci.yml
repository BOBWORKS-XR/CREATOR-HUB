name: Private WebKit SQLite checkpoint fixture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/journal-webkit-snapshot-85' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Pin continuation source and fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 856c55970353821d85c66376e895e86322896910
          mkdir "$RUNNER_TEMP/webkit-snapshot"
          git show HEAD:scripts/native-linux-webkit-checkpoint-fixture.py > "$RUNNER_TEMP/webkit-snapshot/fixture.py"
          test "$(sha256sum "$RUNNER_TEMP/webkit-snapshot/fixture.py" | cut -d' ' -f1)" = e7e62f2cd84325fb0cd2aa208d2f806e764d6a7970898d0ff919e4bb98fe9ce4
          git checkout --detach 856c55970353821d85c66376e895e86322896910
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node - <<'JS'
          const assert = require('node:assert/strict'), fs = require('node:fs');
          const c = require('./scripts/native-linux-changed-mcp-input.cjs');
          const receipt = c.canonical(c.sourceReceipt(fs.realpathSync(process.cwd()), '856c55970353821d85c66376e895e86322896910'));
          assert.equal(c.hash(receipt), 'c1643cb1716c786786f09517b79b1014e6e5f4554a9a5d51ac015029d0c19303');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/webkit-snapshot/source-receipt.json', receipt, {flag:'wx',mode:0o600});
          JS
      - name: Install disposable fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1=2.50.4-0ubuntu0.22.04.1 libwebkit2gtk-4.1-0=2.50.4-0ubuntu0.22.04.1 xvfb xauth
          dpkg-query -W -f='${Version}\n' libwebkit2gtk-4.1-0 > "$RUNNER_TEMP/webkit-snapshot/webkit-version.txt"
          test "$(cat "$RUNNER_TEMP/webkit-snapshot/webkit-version.txt")" = 2.50.4-0ubuntu0.22.04.1
      - name: Run disposable checkpoint experiment
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          /usr/bin/python3 -c 'import sqlite3,sys; print(sys.version); print("SQLite",sqlite3.sqlite_version)' > "$RUNNER_TEMP/webkit-snapshot/versions.txt"
          set +e
          timeout 90 xvfb-run -a /usr/bin/python3 -I -B "$RUNNER_TEMP/webkit-snapshot/fixture.py" > "$RUNNER_TEMP/webkit-snapshot/fixture.log" 2>&1
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/webkit-snapshot/status.txt"
          cat "$RUNNER_TEMP/webkit-snapshot/fixture.log"
          exit "$status"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webkit-snapshot
          if-no-files-found: warn
          retention-days: 7

name: Private synthetic SQLite sentinel fixture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/journal-sqlite-sentinel-67' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify fixture and parent source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 856c55970353821d85c66376e895e86322896910
          mkdir "$RUNNER_TEMP/sqlite-sentinel-results"
          git show HEAD:scripts/native-linux-sqlite-sentinel.test.py > "$RUNNER_TEMP/sqlite-sentinel-results/fixture.py"
          test "$(sha256sum "$RUNNER_TEMP/sqlite-sentinel-results/fixture.py" | cut -d' ' -f1)" = 47be204d1f0928857562abc240b68d5ba7d3a7c0974b8d50e8295a0203f1b42a
          git checkout --detach 856c55970353821d85c66376e895e86322896910
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node - <<'JS'
          const assert = require('node:assert/strict'), fs = require('node:fs');
          const c = require('./scripts/native-linux-changed-mcp-input.cjs');
          const receipt = c.canonical(c.sourceReceipt(fs.realpathSync(process.cwd()), '856c55970353821d85c66376e895e86322896910'));
          assert.equal(c.hash(receipt), 'c1643cb1716c786786f09517b79b1014e6e5f4554a9a5d51ac015029d0c19303');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/sqlite-sentinel-results/source-receipt.json', receipt, {flag:'wx',mode:0o600});
          JS
      - name: Run only the isolated SQLite fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          /usr/bin/python3 -I -S -B "$RUNNER_TEMP/sqlite-sentinel-results/fixture.py" > "$RUNNER_TEMP/sqlite-sentinel-results/fixture.log" 2>&1 || { cat "$RUNNER_TEMP/sqlite-sentinel-results/fixture.log"; exit 1; }
          cat "$RUNNER_TEMP/sqlite-sentinel-results/fixture.log"
      - name: Retain synthetic fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-sentinel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sqlite-sentinel-results
          if-no-files-found: warn
          retention-days: 7

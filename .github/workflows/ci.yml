name: Private SQLite distinct-process assessment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/journal-sqlite-distinct-process-78' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source and synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 856c55970353821d85c66376e895e86322896910
          mkdir "$RUNNER_TEMP/sqlite-distinct"
          git show HEAD:scripts/sqlite-distinct-process.test.py > "$RUNNER_TEMP/sqlite-distinct/distinct-process.test.py"
          git show HEAD:scripts/sqlite-two-phase.test.py > "$RUNNER_TEMP/sqlite-distinct/two-phase.test.py"
          test "$(sha256sum "$RUNNER_TEMP/sqlite-distinct/distinct-process.test.py" | cut -d' ' -f1)" = 7a9365e7d41d02ee66f47ec3ada1e7c3ba0ac4c8857795799224890f7c96a76a
          test "$(sha256sum "$RUNNER_TEMP/sqlite-distinct/two-phase.test.py" | cut -d' ' -f1)" = 82856fb0b1d237cb662348a0a80305c7a9149068331e4de2e8be1c4bc23eaa22
          git checkout --detach 856c55970353821d85c66376e895e86322896910
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node - <<'JS'
          const assert = require('node:assert/strict'), fs = require('node:fs');
          const c = require('./scripts/native-linux-changed-mcp-input.cjs');
          const receipt = c.canonical(c.sourceReceipt(fs.realpathSync(process.cwd()), '856c55970353821d85c66376e895e86322896910'));
          assert.equal(c.hash(receipt), 'c1643cb1716c786786f09517b79b1014e6e5f4554a9a5d51ac015029d0c19303');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/sqlite-distinct/source-receipt.json', receipt, {flag:'wx',mode:0o600});
          JS
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.11.17'
          update-environment: false
      - name: Run distinct-process WAL tests
        shell: bash
        env:
          P: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          "$P" -I -S -c 'import sys,sqlite3; print(sys.version); print("SQLite",sqlite3.sqlite_version)' > "$RUNNER_TEMP/sqlite-distinct/versions.txt"
          set +e
          timeout 90 "$P" -I -S -B "$RUNNER_TEMP/sqlite-distinct/distinct-process.test.py" > "$RUNNER_TEMP/sqlite-distinct/test.log" 2>&1
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/sqlite-distinct/status.txt"
          cat "$RUNNER_TEMP/sqlite-distinct/test.log"
          exit "$status"
      - name: Retain assessment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-distinct-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sqlite-distinct
          if-no-files-found: warn
          retention-days: 7

name: Exact journal continuation full preflight and DEB comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/journal-real-inventory-full-116' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check out exact source commit and independently reproduce its receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 84bc5bb2de16fd1c2b633b5f7c373d05f2bd3e6f
          git show HEAD:scripts/native-linux-cold-boundary-preflight.test.py > "$RUNNER_TEMP/cold-boundary-preflight.py"
          test "$(sha256sum "$RUNNER_TEMP/cold-boundary-preflight.py" | cut -d' ' -f1)" = 4e7f920a83cc3c7df78e4034889200ef81405ab3c87016134484026e93e4b0d1
          git checkout --detach 84bc5bb2de16fd1c2b633b5f7c373d05f2bd3e6f
          test "$(git rev-parse HEAD^{tree})" = b869f5854df6e2c66eac858e6c9a2a4267458982
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node - <<'JS'
          const assert = require('node:assert/strict'), fs = require('node:fs');
          const c = require('./scripts/native-linux-changed-mcp-input.cjs');
          const receipt = c.canonical(c.sourceReceipt(fs.realpathSync(process.cwd()), '84bc5bb2de16fd1c2b633b5f7c373d05f2bd3e6f'));
          assert.equal(c.hash(receipt), 'c4be2193e5be30a9e80e5fe26cfd7c060a195680671394476444405c5370ff40');
          fs.mkdirSync(process.env.RUNNER_TEMP + '/full-preflight-results', {mode:0o700});
          fs.writeFileSync(process.env.RUNNER_TEMP + '/full-preflight-results/source-receipt.json', receipt, {flag:'wx',mode:0o600});
          JS
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.11.17'
          update-environment: false
      - name: Install test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run all inherited changed-MCP preflight suites
        shell: bash
        env:
          PREFLIGHT_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -uo pipefail
          test "$(id -u)" -ne 0 || exit 1
          "$PREFLIGHT_PYTHON" -I -c 'import sys,tomllib; assert sys.version_info[:3] == (3,11,17)' || exit 1
          failed=0
          run_case() {
            local name="$1"; shift
            if "$@" > "$RUNNER_TEMP/full-preflight-results/$name.log" 2>&1; then status=0; else status=$?; fi
            printf '%s %s\n' "$name" "$status" | tee -a "$RUNNER_TEMP/full-preflight-results/status.txt"
            if [[ "$status" != 0 ]]; then tail -n 100 "$RUNNER_TEMP/full-preflight-results/$name.log"; failed=1; fi
          }
          run_case polkit "$PREFLIGHT_PYTHON" -B scripts/native-linux-polkit-probe.test.py
          run_case root-probe "$PREFLIGHT_PYTHON" -B scripts/native-linux-root-probe.test.py
          run_case unix-window "$PREFLIGHT_PYTHON" -B scripts/native-unix-window.test.py
          run_case node-input node --test scripts/native-linux-production-016-input.test.cjs scripts/native-linux-production-016-migration-workflow.test.cjs scripts/native-linux-changed-mcp-input.test.cjs
          run_case production-stage "$PREFLIGHT_PYTHON" -B scripts/native-linux-production-016-stage.test.py
          run_case migration "$PREFLIGHT_PYTHON" -B scripts/native-linux-production-016-migration.test.py
          run_case update "$PREFLIGHT_PYTHON" -I -S -B scripts/native-linux-production-016-update.test.py
          run_case continuation "$PREFLIGHT_PYTHON" -I -S -B scripts/native-linux-migrated-update.test.py
          run_case cold-boundary "$PREFLIGHT_PYTHON" -I -S -B "$RUNNER_TEMP/cold-boundary-preflight.py"
          run_case held-reader "$PREFLIGHT_PYTHON" -I -S -B scripts/native-linux-localstorage-snapshot.test.py HeldReaderTests
          run_case root-reader sudo -n "$PREFLIGHT_PYTHON" -I -S -B scripts/native-linux-localstorage-snapshot.test.py RootToSyntheticUidTests
          run_case sealed-adoption sudo -n "$PREFLIGHT_PYTHON" -I -S -B scripts/native-linux-sealed-adoption.test.py
          run_case feed node --test scripts/linux-update-lab-feed.test.cjs scripts/linux-update-lab-feed-changed-mcp.test.cjs
          exit "$failed"
      - name: Acquire only exact API-bound original assembly archives
        uses: actions/github-script@v8
        with:
          retries: 0
          script: |
            const fs = require('node:fs'), path = require('node:path'), assert = require('node:assert/strict'), crypto = require('node:crypto');
            const c = require('./scripts/native-linux-changed-mcp-input.cjs');
            const neutral = require('./scripts/native-linux-016-input.cjs');
            const p = c.profile(fs.readFileSync('./scripts/fixtures/native-linux-changed-mcp-profile.json'));
            const incoming = JSON.parse(fs.readFileSync('./scripts/fixtures/journal-a-native-incoming.UNBOUND.json'));
            const repo = {owner:'BOBWORKS-XR',repo:'CREATOR-HUB'};
            const out = path.join(process.env.RUNNER_TEMP, 'exact-deb-data'); fs.mkdirSync(out,{mode:0o700});
            for (const role of ['assembly16','assembly17']) {
              const e = p.artifacts[role];
              const run = (await github.rest.actions.getWorkflowRun({...repo,run_id:e.run})).data;
              const job = (await github.rest.actions.getJobForWorkflowRun({...repo,job_id:e.job})).data;
              const artifact = (await github.rest.actions.getArtifact({...repo,artifact_id:e.artifact})).data;
              const commit = (await github.rest.git.getCommit({...repo,commit_sha:e.source})).data;
              c.producer({run,job,artifact,commit}, e);
              if (role === 'assembly16') neutral.journalAFreshArtifactBinding(run, job, artifact, incoming.assembly);
              else {
                assert.equal(job.name,'assemble'); assert.equal(job.head_branch,e.branch);
                for (const k of ['repository_id','head_repository_id']) assert.equal(artifact.workflow_run[k],1364807512);
                const times = [job.started_at,artifact.created_at,job.completed_at].map(Date.parse);
                assert.ok(times.every(Number.isFinite) && times[0] <= times[1] && times[1] <= times[2]);
              }
              const response = await github.rest.actions.downloadArtifact({...repo,artifact_id:e.artifact,archive_format:'zip'});
              const bytes = Buffer.from(response.data);
              assert.equal(bytes.length,e.zip.size); assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),e.zip.sha256);
              fs.writeFileSync(path.join(out,role+'.zip'),bytes,{flag:'wx',mode:0o600});
              fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'full-preflight-results',role+'-api.json'),
                JSON.stringify({run,job,artifact,commit},null,2)+'\n',{flag:'wx',mode:0o600});
            }
      - name: Compare actual Linux A and 017 DEB packages
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S -B - <<'PY' > "$RUNNER_TEMP/full-preflight-results/deb-comparison.json"
          import importlib.util, json, os, pathlib, sys
          source = pathlib.Path('scripts/native-linux-migrated-update.py').resolve()
          spec = importlib.util.spec_from_file_location('exact_preflight', source)
          m = importlib.util.module_from_spec(spec); sys.modules[spec.name] = m; spec.loader.exec_module(m)
          u = m.U
          p = m.changed_profile(pathlib.Path('scripts/fixtures/native-linux-changed-mcp-profile.json').read_bytes())
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'exact-deb-data'
          members = root / 'members'; members.mkdir(mode=0o700)
          for role in ('assembly16', 'assembly17'):
              u.stage_zip(root / (role + '.zip'), p['artifacts'][role], members / role)
          reader = u.load('private-linux-update-fixture-017-package-verify'); base = reader.base_reader()
          a, b = u.actual017_a1_data(), u.actual017_target_data()
          old = reader.inspect(u.object_path(root, p, 'deb16'), {k:a[k] for k in ('deb','hub','helper','policy','service')}, base, '0.1.16')
          new = reader.inspect(u.object_path(root, p, 'deb17'), {k:b[k] for k in ('deb','hub','archive','helper','policy','service')}, base, '0.1.17')
          qualification = u.actual017_compare_update_packages(old, new, a)
          print(json.dumps({'status':'actual-linux-package-compare-passed','qualification':qualification,
                            'signatureVerifiedHere':False,'candidateExecuted':False,'installed':False,'releaseReady':False},indent=2))
          PY
      - name: Retain test results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-full-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-preflight-results
          if-no-files-found: warn
          retention-days: 7

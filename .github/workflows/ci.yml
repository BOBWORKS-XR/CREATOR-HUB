name: Private SQLite cold-copy race assessment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/journal-cold-copy-86' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source and synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 856c55970353821d85c66376e895e86322896910
          mkdir "$RUNNER_TEMP/cold-copy"
          git show HEAD:scripts/native-linux-cold-copy.test.py > "$RUNNER_TEMP/cold-copy/fixture.py"
          test "$(sha256sum "$RUNNER_TEMP/cold-copy/fixture.py" | cut -d' ' -f1)" = e5251df976e20bb72999faf143b9dae8df43772f52c5c6760e7808ecf3ff5d29
          git checkout --detach 856c55970353821d85c66376e895e86322896910
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node - <<'JS'
          const assert = require('node:assert/strict'), fs = require('node:fs');
          const c = require('./scripts/native-linux-changed-mcp-input.cjs');
          const receipt = c.canonical(c.sourceReceipt(fs.realpathSync(process.cwd()), '856c55970353821d85c66376e895e86322896910'));
          assert.equal(c.hash(receipt), 'c1643cb1716c786786f09517b79b1014e6e5f4554a9a5d51ac015029d0c19303');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/cold-copy/source-receipt.json', receipt, {flag:'wx',mode:0o600});
          JS
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.11.17'
          update-environment: false
      - name: Run bounded distinct-process race tests
        shell: bash
        env:
          P: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          "$P" -I -S -c 'import sqlite3,sys; print(sys.version); print("SQLite",sqlite3.sqlite_version)' > "$RUNNER_TEMP/cold-copy/versions.txt"
          set +e
          timeout 60 "$P" -I -S -B "$RUNNER_TEMP/cold-copy/fixture.py" > "$RUNNER_TEMP/cold-copy/test.log" 2>&1
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/cold-copy/status.txt"
          cat "$RUNNER_TEMP/cold-copy/test.log"
          exit "$status"
      - name: Retain synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-copy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cold-copy
          if-no-files-found: warn
          retention-days: 7

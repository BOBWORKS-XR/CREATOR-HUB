name: Private standalone WebKit close reopen observation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    if: github.repository_id == '1364807512' && github.ref == 'refs/heads/validation/webkit-close-repro-131-20261101' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Bind standalone fixture
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/webkit-close-evidence"
          test "$(sha256sum scripts/native-linux-webkit-close-repro.py | cut -d' ' -f1)" = 85b5865aef1124f12ef6b8cd2b716178c58569fe908b13e0661e043eb04d4962
          git rev-parse HEAD > "$RUNNER_TEMP/webkit-close-evidence/commit.txt"
      - name: Install exact WebKit fixture dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1=2.50.4-0ubuntu0.22.04.1 libwebkit2gtk-4.1-0=2.50.4-0ubuntu0.22.04.1 xvfb xauth
          test "$(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-0)" = 2.50.4-0ubuntu0.22.04.1
          dpkg-query -W libwebkit2gtk-4.1-0 libsqlite3-0 | tee "$RUNNER_TEMP/webkit-close-evidence/packages.txt"
          /usr/bin/python3 -c 'import sqlite3; assert sqlite3.sqlite_version == "3.37.2", sqlite3.sqlite_version'
      - name: Run isolated close and reopen observation
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          timeout 150s xvfb-run -a /usr/bin/python3 -I -B scripts/native-linux-webkit-close-repro.py > "$RUNNER_TEMP/webkit-close-evidence/fixture.log" 2>&1 || { cat "$RUNNER_TEMP/webkit-close-evidence/fixture.log"; exit 1; }
          cat "$RUNNER_TEMP/webkit-close-evidence/fixture.log"
      - name: Retain observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-close-repro-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webkit-close-evidence
          if-no-files-found: warn
          retention-days: 14

name: Private standalone WebKit journal-mode fixture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/journal-webkit-nonwal-69' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Pin standalone fixture and parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 856c55970353821d85c66376e895e86322896910
          mkdir "$RUNNER_TEMP/webkit-nonwal-result"
          git show HEAD:scripts/native-linux-webkit-delete-fixture.py > "$RUNNER_TEMP/webkit-nonwal-result/fixture.py"
          test "$(sha256sum "$RUNNER_TEMP/webkit-nonwal-result/fixture.py" | cut -d' ' -f1)" = 5c059da5cedb4d6adc8415cc05e6c5e15f9fc4e3017a0e2f7ff1c653152bfc19
      - name: Install only disposable WebKit fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1=2.50.4-0ubuntu0.22.04.1 libwebkit2gtk-4.1-0=2.50.4-0ubuntu0.22.04.1 xvfb xauth
          test "$(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-0)" = 2.50.4-0ubuntu0.22.04.1
      - name: Test synthetic SQLite DELETE mode across standalone WebKit reopen
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          xvfb-run -a /usr/bin/python3 -I -B "$RUNNER_TEMP/webkit-nonwal-result/fixture.py" > "$RUNNER_TEMP/webkit-nonwal-result/fixture.log" 2>&1 || { cat "$RUNNER_TEMP/webkit-nonwal-result/fixture.log"; exit 1; }
          cat "$RUNNER_TEMP/webkit-nonwal-result/fixture.log"
      - name: Retain fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-webkit-nonwal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webkit-nonwal-result
          if-no-files-found: warn
          retention-days: 7

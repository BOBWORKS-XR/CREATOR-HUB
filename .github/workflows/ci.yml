name: CI

on:
  push:
    branches: ["ui-preview", "master", "workflow*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-router:
    name: MCP runtime router (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/mcp-router
      - run: cargo fmt --manifest-path native/mcp-router/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path native/mcp-router/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --release --locked --manifest-path native/mcp-router/Cargo.toml

  frontend:
    name: Frontend & script tests
    runs-on: ubuntu-22.04
    env:
      CREATOR_SETUP_SOURCE: ${{ github.workspace }}/modules/project-setup/src
      CREATOR_MCP_SOURCE: ${{ github.workspace }}/modules/mcp/launcher/src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:sources
      - run: npm --prefix modules/mcp ci
      - run: npm --prefix modules/project-setup ci
      - run: npm run test:modules
      - run: npm run test:scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  hub-windows:
    name: Hub (Windows)
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - name: Build Windows release binary and NSIS bundle
        run: npm run build -- --bundles nsis
      - name: Retain development packages (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: hub-development-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

  builtin-windows:
    name: Built-in modules (clean Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            modules/mcp/launcher/src-tauri
            modules/project-setup/src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm --prefix modules/mcp ci
      - run: npm --prefix modules/project-setup ci
      - run: npm run build:unified -- ci-windows
      - name: Test native MCP settings and ownership guards
        run: cargo test --release --locked --manifest-path modules/mcp/launcher/src-tauri/Cargo.toml
      - name: Test native Project Setup guards and repairs
        run: cargo test --release --locked --manifest-path modules/project-setup/src-tauri/Cargo.toml
      - run: npx playwright install chromium
      - name: Open both bundled modules without companion installations
        timeout-minutes: 8
        run: node scripts/native-builtin-smoke.cjs artifacts/unified/ci-windows
      - name: Verify retained MCP routing with real SDK reconnect and scoped process cleanup
        timeout-minutes: 5
        run: node scripts/native-router-smoke.cjs artifacts/unified/ci-windows
      - name: Retain native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builtin-windows-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/native-suite-*/report.json
            artifacts/native-suite-*/*.png
            artifacts/native-suite-*/*.txt
            artifacts/router-native-*/report.json

  hub-linux:
    name: Hub (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file \
            rpm
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - run: npm --prefix modules/mcp ci
      - run: npm --prefix modules/mcp run release:launcher
      - name: Test native MCP settings and Unix ownership guards
        run: cargo test --release --locked --manifest-path modules/mcp/launcher/src-tauri/Cargo.toml --target-dir src-tauri/target
      - name: Test native Project Setup guards and repairs
        run: cargo test --release --locked --manifest-path modules/project-setup/src-tauri/Cargo.toml --target-dir src-tauri/target
      - name: Build Linux AppImage, DEB, and RPM bundle
        run: NO_STRIP=1 npm run build -- --bundles appimage,deb,rpm
      - name: Retain development packages (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: hub-development-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  hub-macos:
    name: Hub (macOS ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Apple silicon
          - os: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Use a canonical temporary path for macOS test fixtures
        shell: bash
        run: echo "TMPDIR=$(node -p "require('fs').realpathSync(require('os').tmpdir())")" >> "$GITHUB_ENV"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - run: npm --prefix modules/mcp ci
      - run: npm --prefix modules/mcp run release:launcher
      - name: Test native MCP settings and Unix ownership guards
        run: cargo test --release --locked --manifest-path modules/mcp/launcher/src-tauri/Cargo.toml --target-dir src-tauri/target
      - name: Test native Project Setup guards and repairs
        run: cargo test --release --locked --manifest-path modules/project-setup/src-tauri/Cargo.toml --target-dir src-tauri/target
      - name: Build macOS DMG bundle
        run: npm run build -- --bundles dmg
      - name: Verify ad-hoc signed app inside macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          mountpoint="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mountpoint" -quiet || true
            rmdir "$mountpoint" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "${images[0]}" -readonly -nobrowse -quiet -mountpoint "$mountpoint"
          app="$(find "$mountpoint" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          details="$(codesign --display --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$details"
          grep -Fq 'Signature=adhoc' <<< "$details"
      - name: Retain development packages (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: hub-development-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

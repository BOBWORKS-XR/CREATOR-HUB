name: Private held SQLite guard focused tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/journal-held-guard-92' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify parent and exact focused sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 856c55970353821d85c66376e895e86322896910
          test "$(sha256sum scripts/native-linux-localstorage-snapshot.py | cut -d' ' -f1)" = 6722616d0e186dcbdb45db2936cb1f02f7785b43f7f1ebdcc10b6682ed7af45a
          test "$(sha256sum scripts/native-linux-localstorage-snapshot.test.py | cut -d' ' -f1)" = b45fb3b8a73c20aa3351537149ff4123dade4b181e29c97f27cbe1efa54ca5f7
          test "$(sha256sum scripts/native-linux-migrated-update.py | cut -d' ' -f1)" = b90ba265f81f1485063b4bd940ddcd72b6ef79de30e24ac93a7d7f851d91ac41
          test "$(sha256sum scripts/native-linux-migrated-update.test.py | cut -d' ' -f1)" = a196600ea0570af2915ba229a14327927e5c0368838020abb8092a790d1a262d
          mkdir "$RUNNER_TEMP/held-guard"
          git rev-parse HEAD > "$RUNNER_TEMP/held-guard/commit.txt"
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.11.17'
          update-environment: false
      - name: Run bounded UID, process and guard tests
        shell: bash
        env:
          P: ${{ steps.python.outputs.python-path }}
        run: |
          set -uo pipefail
          failed=0
          run_case() {
            local name="$1"; shift
            if timeout 120 "$@" > "$RUNNER_TEMP/held-guard/$name.log" 2>&1; then status=0; else status=$?; fi
            printf '%s %s\n' "$name" "$status" | tee -a "$RUNNER_TEMP/held-guard/status.txt"
            if [[ "$status" != 0 ]]; then tail -n 80 "$RUNNER_TEMP/held-guard/$name.log"; failed=1; fi
          }
          run_case reader "$P" -I -S -B scripts/native-linux-localstorage-snapshot.test.py HeldReaderTests
          run_case root sudo -n "$P" -I -S -B scripts/native-linux-localstorage-snapshot.test.py RootToSyntheticUidTests
          run_case guard "$P" -I -S -B scripts/native-linux-migrated-update.test.py TransitionHomeTests SealedContinuationSourcesTests
          exit "$failed"
      - name: Retain focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: held-guard-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/held-guard
          if-no-files-found: warn
          retention-days: 7

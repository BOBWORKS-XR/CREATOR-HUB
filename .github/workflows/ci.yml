name: Private sealed fixture Linux preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/journal-home-diag-preflight-61' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check exact candidate and reproduce source receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b94ac2d2d9a6e9bb0037b4fcc26281cffe8e7566
          git checkout --detach b94ac2d2d9a6e9bb0037b4fcc26281cffe8e7566
          test "$(git rev-parse HEAD^{tree})" = 61897ad4d2f1da3886ead9a5a7b51e73c30fbffd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir "$RUNNER_TEMP/fixture-preflight"
          node - <<'JS'
          const assert = require('node:assert/strict'), fs = require('node:fs');
          const c = require('./scripts/native-linux-changed-mcp-input.cjs');
          const receipt = c.canonical(c.sourceReceipt(fs.realpathSync(process.cwd()), 'b94ac2d2d9a6e9bb0037b4fcc26281cffe8e7566'));
          assert.equal(c.hash(receipt), '1f42f643599fe8ad0e8ae5a6c5d7e424591ac3340ce9b532c00ac69e688693c2');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/fixture-preflight/source-receipt.json', receipt, {flag:'wx',mode:0o600});
          JS
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.11.17'
          update-environment: false
      - name: Install test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run fixture and migration wiring regressions
        shell: bash
        env:
          PREFLIGHT_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -uo pipefail
          test "$(id -u)" -ne 0 || exit 1
          "$PREFLIGHT_PYTHON" -I -c 'import sys; assert sys.version_info[:3] == (3,11,17)' || exit 1
          failed=0
          run_case() {
            local name="$1"; shift
            if "$@" > "$RUNNER_TEMP/fixture-preflight/$name.log" 2>&1; then status=0; else status=$?; fi
            printf '%s %s\n' "$name" "$status" | tee -a "$RUNNER_TEMP/fixture-preflight/status.txt"
            if [[ "$status" != 0 ]]; then tail -n 100 "$RUNNER_TEMP/fixture-preflight/$name.log"; failed=1; fi
          }
          run_case sealed-profile "$PREFLIGHT_PYTHON" -B scripts/native-linux-production-016-migration.test.py SealedProfileTests
          run_case migration "$PREFLIGHT_PYTHON" -B scripts/native-linux-production-016-migration.test.py
          run_case continuation "$PREFLIGHT_PYTHON" -I -S -B scripts/native-linux-migrated-update.test.py
          run_case stage "$PREFLIGHT_PYTHON" -B scripts/native-linux-production-016-stage.test.py
          run_case wiring node --test scripts/native-linux-production-016-migration-workflow.test.cjs
          exit "$failed"
      - name: Retain preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-fixture-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixture-preflight
          if-no-files-found: warn
          retention-days: 7

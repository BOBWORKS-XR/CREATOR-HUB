name: Private synthetic SQLite logical guard checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    if: github.repository_id == '1364807512' && github.ref == 'refs/heads/validation/synthetic-logical-guard-133-20261101' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify isolated candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 6db0cd2d6817549c1faf0467653613400a9dbd6a
          git diff --exit-code HEAD^ HEAD -- scripts
          mkdir "$RUNNER_TEMP/logical-guard"
          git rev-parse HEAD > "$RUNNER_TEMP/logical-guard/commit.txt"
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.11.17'
          update-environment: false
      - name: Run standalone synthetic tests
        env:
          P: ${{ steps.python.outputs.python-path }}
        run: |
          set -uo pipefail
          failed=0
          run_case() {
            local name="$1"; shift
            if timeout 120 "$@" > "$RUNNER_TEMP/logical-guard/$name.log" 2>&1; then status=0; else status=$?; fi
            printf '%s %s\n' "$name" "$status" | tee -a "$RUNNER_TEMP/logical-guard/status.txt"
            if [[ "$status" != 0 ]]; then tail -n 100 "$RUNNER_TEMP/logical-guard/$name.log"; failed=1; fi
          }
          run_case reader "$P" -I -S -B scripts/native-linux-localstorage-snapshot.test.py CanonicalDigestTests HeldReaderTests
          run_case root-reader sudo -n "$P" -I -S -B scripts/native-linux-localstorage-snapshot.test.py RootToSyntheticUidTests
          run_case adoption sudo -n "$P" -I -S -B scripts/native-linux-sealed-adoption.test.py
          run_case guard "$P" -I -S -B scripts/native-linux-migrated-update.test.py ColdLocalStorageDiagnosticTests TransitionHomeTests SealedContinuationSourcesTests ChangedCaseSourceTests SourceBindingTests
          exit "$failed"
      - name: Retain fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-logical-guard-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/logical-guard
          if-no-files-found: warn
          retention-days: 14

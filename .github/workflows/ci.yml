name: Private synthetic localstorage preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/journal-localstorage-preflight-64' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact test source receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 4f075842073e846096dc394b7d84173a383a6c9d
          git checkout --detach 4f075842073e846096dc394b7d84173a383a6c9d
          test "$(git rev-parse HEAD^{tree})" = bfcbe3e04c3cfe1c6fd6ffd3428ffb57e0841c5a
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir "$RUNNER_TEMP/localstorage-preflight"
          node - <<'JS'
          const assert = require('node:assert/strict'), fs = require('node:fs');
          const c = require('./scripts/native-linux-changed-mcp-input.cjs');
          const receipt = c.canonical(c.sourceReceipt(fs.realpathSync(process.cwd()), '4f075842073e846096dc394b7d84173a383a6c9d'));
          assert.equal(c.hash(receipt), 'b4de3efe0b41fb894c3a7b36a53acb65dfe7280d5a15dc8b8dacf5a286f02f2b');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/localstorage-preflight/source-receipt.json', receipt, {flag:'wx',mode:0o600});
          JS
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.11.17'
          update-environment: false
      - name: Test synthetic SQLite ownership and fail-closed preservation
        shell: bash
        env:
          PREFLIGHT_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          "$PREFLIGHT_PYTHON" -I -c 'import sys; assert sys.version_info[:3] == (3,11,17)'
          "$PREFLIGHT_PYTHON" -I -S -B scripts/native-linux-migrated-update.test.py \
            TransitionHomeTests.test_exact_webkit_localstorage_sidecars_remain_untrusted_additions \
            TransitionHomeTests.test_synthetic_sqlite_wal_can_hold_committed_setting_with_unchanged_main_database \
            TransitionHomeTests.test_synthetic_sqlite_sidecars_inherit_private_database_owner \
            TransitionHomeTests.test_unexpected_home_paths_are_bounded_diagnostic_only_and_still_refuse \
            TransitionHomeTests.test_unsafe_path_is_omitted_without_changing_refusal \
            TransitionHomeTests.test_diagnostic_failure_never_replaces_original_guard_refusal \
            TransitionHomeTests.test_bounded_non_ascii_paths_survive_json_escaping \
            TransitionHomeTests.test_ready_phase_and_report_wiring_are_retained \
            > "$RUNNER_TEMP/localstorage-preflight/tests.log" 2>&1 || { cat "$RUNNER_TEMP/localstorage-preflight/tests.log"; exit 1; }
          cat "$RUNNER_TEMP/localstorage-preflight/tests.log"
      - name: Retain synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-localstorage-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/localstorage-preflight
          if-no-files-found: warn
          retention-days: 7

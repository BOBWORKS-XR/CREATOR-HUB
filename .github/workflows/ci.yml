name: Private A/017 continuation Linux preflight (not acceptance)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/journal-exact-rebind-preflight-48' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact private projection and test-only workflow delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = c544796174c6f36e2ffb92a4ceb6cd1bcc08611b
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          export GIT_INDEX_FILE="$RUNNER_TEMP/preflight-source-index"
          test ! -e "$GIT_INDEX_FILE"
          git read-tree HEAD
          original=$(git rev-parse c544796174c6f36e2ffb92a4ceb6cd1bcc08611b:.github/workflows/ci.yml)
          git update-index --cacheinfo "100644,$original,.github/workflows/ci.yml"
          test "$(git write-tree)" = f8e61a1e503a3f0f98966fffabcaa338f7b25c23
          printf 'Exact A/017 lane source tree verified; workflow-only change excluded.\n'
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.11.17'
      - name: Install test dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run focused preservation and A-binding regressions
        shell: bash
        env:
          PREFLIGHT_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -uo pipefail
          test "$(id -u)" -ne 0 || exit 1
          "$PREFLIGHT_PYTHON" -I -c 'import sys, tomllib; assert sys.version_info[:3] == (3, 11, 17)' || exit 1
          mkdir "$RUNNER_TEMP/a-preflight-results"
          failed=0
          run_case() {
            local name="$1"; shift
            "$@" > "$RUNNER_TEMP/a-preflight-results/$name.log" 2>&1
            local status=$?
            printf '%s %s\n' "$name" "$status" | tee -a "$RUNNER_TEMP/a-preflight-results/status.txt"
            if [[ "$status" != 0 ]]; then tail -n 100 "$RUNNER_TEMP/a-preflight-results/$name.log"; failed=1; fi
          }
          run_case journal-generation "$PREFLIGHT_PYTHON" -I -S -B scripts/native-linux-migrated-update.test.py TransitionHomeTests SuccessorStateTests GenerationDirectoryModesTests TransitionCompositionTests
          run_case fixture-lifecycle "$PREFLIGHT_PYTHON" -I -S -B scripts/native-linux-migrated-update.test.py RefusedProcessObservationTests FixtureReapingKernelTests FixtureQuiescenceTests BrokerTests
          run_case generation-ready "$PREFLIGHT_PYTHON" -I -S -B scripts/native-linux-migrated-update.test.py ReadyKernelTests ChangedCaseOutcomeTests
          run_case auth-window "$PREFLIGHT_PYTHON" -B scripts/native-linux-production-016-migration.test.py VisibleAgentReadyTests AuthenticationDetailsTests ControllerTests.test_each_successful_authentication_guard_rechecks_both_sides_of_the_kernel_proof_wait ControllerTests.test_original_authority_and_logind_session_are_revalidated_after_broker_wait_before_any_input
          run_case auth-agent "$PREFLIGHT_PYTHON" -B scripts/native-linux-polkit-probe.test.py CaptureTests AuthenticateTests NativeDismissalTests
          run_case update-activation "$PREFLIGHT_PYTHON" -I -S -B scripts/native-linux-production-016-update.test.py TransitionConsumerTests Actual017AuthorizationTests HtmlDebLifecycleTests Actual017ReopenedProjectsTests
          run_case pair-binding node --test scripts/journal-native-pair.test.cjs scripts/journal-native-pair-lane.test.cjs
          run_case changed-case "$PREFLIGHT_PYTHON" -I -S -B scripts/native-linux-migrated-update.test.py ChangedCaseAdmissionTests ChangedCaseOutcomeTests ChangedCaseStagingTests ChangedCaseSourceTests ChangedCaseVerifierTests ChangedCaseExportTests ChangedCaseTransportTests
          run_case actual017-adapter "$PREFLIGHT_PYTHON" -I -S -B scripts/native-linux-production-016-update.test.py Actual017AdapterTests
          run_case stage "$PREFLIGHT_PYTHON" -B scripts/native-linux-production-016-stage.test.py
          run_case node-binding node --test scripts/native-linux-016-input.test.cjs scripts/native-linux-production-016-input.test.cjs scripts/native-linux-production-016-migration-workflow.test.cjs scripts/native-linux-changed-mcp-input.test.cjs
          exit "$failed"
      - name: Retain test-only preflight logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-pair-linux-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a-preflight-results
          if-no-files-found: warn
          retention-days: 7

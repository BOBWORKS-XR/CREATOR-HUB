name: Private quiescence lifecycle assessment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/journal-quiescence-assessment-76' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source and assessment fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 856c55970353821d85c66376e895e86322896910
          mkdir "$RUNNER_TEMP/quiescence-assessment"
          git show HEAD:scripts/native-linux-quiescence-boundary.test.py > "$RUNNER_TEMP/quiescence-assessment/boundary.test.py"
          test "$(sha256sum "$RUNNER_TEMP/quiescence-assessment/boundary.test.py" | cut -d' ' -f1)" = 2f60332f81bb6de0f67e23788714d2a1956706c7d4e12565173dddb1ed6b4ecf
          git checkout --detach 856c55970353821d85c66376e895e86322896910
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node - <<'JS'
          const assert = require('node:assert/strict'), fs = require('node:fs');
          const c = require('./scripts/native-linux-changed-mcp-input.cjs');
          const receipt = c.canonical(c.sourceReceipt(fs.realpathSync(process.cwd()), '856c55970353821d85c66376e895e86322896910'));
          assert.equal(c.hash(receipt), 'c1643cb1716c786786f09517b79b1014e6e5f4554a9a5d51ac015029d0c19303');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/quiescence-assessment/source-receipt.json', receipt, {flag:'wx',mode:0o600});
          JS
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.11.17'
          update-environment: false
      - name: Run focused lifecycle and inventory tests
        shell: bash
        env:
          P: ${{ steps.python.outputs.python-path }}
        run: |
          set -uo pipefail
          test "$(id -u)" -ne 0 || exit 1
          failed=0
          run_case() {
            local name="$1"; shift
            if "$@" > "$RUNNER_TEMP/quiescence-assessment/$name.log" 2>&1; then status=0; else status=$?; fi
            printf '%s %s\n' "$name" "$status" | tee -a "$RUNNER_TEMP/quiescence-assessment/status.txt"
            if [[ "$status" != 0 ]]; then tail -n 80 "$RUNNER_TEMP/quiescence-assessment/$name.log"; failed=1; fi
          }
          run_case boundary "$P" -I -S -B "$RUNNER_TEMP/quiescence-assessment/boundary.test.py"
          run_case quiescence "$P" -I -S -B scripts/native-linux-migrated-update.test.py FixtureQuiescenceTests FixtureReapingKernelTests
          run_case inventory "$P" -I -S -B scripts/native-linux-production-016-migration.test.py RootGlobalInventoryTests
          exit "$failed"
      - name: Retain lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-quiescence-assessment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quiescence-assessment
          if-no-files-found: warn
          retention-days: 7

name: Private synthetic UID SQLite backup assessment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/journal-synthetic-uid-backup-88' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source and synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 856c55970353821d85c66376e895e86322896910
          mkdir "$RUNNER_TEMP/synthetic-uid-backup"
          git show HEAD:scripts/native-linux-synthetic-uid-backup.test.py > "$RUNNER_TEMP/synthetic-uid-backup/fixture.py"
          test "$(sha256sum "$RUNNER_TEMP/synthetic-uid-backup/fixture.py" | cut -d' ' -f1)" = 53a4d657f9ec6fb538196a2609b0215550db94b954499aab406037006b6e2acb
          git checkout --detach 856c55970353821d85c66376e895e86322896910
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node - <<'JS'
          const assert = require('node:assert/strict'), fs = require('node:fs');
          const c = require('./scripts/native-linux-changed-mcp-input.cjs');
          const receipt = c.canonical(c.sourceReceipt(fs.realpathSync(process.cwd()), '856c55970353821d85c66376e895e86322896910'));
          assert.equal(c.hash(receipt), 'c1643cb1716c786786f09517b79b1014e6e5f4554a9a5d51ac015029d0c19303');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/synthetic-uid-backup/source-receipt.json', receipt, {flag:'wx',mode:0o600});
          JS
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.11.17'
          update-environment: false
      - name: Run isolated backup tests
        shell: bash
        env:
          P: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          "$P" -I -S -c 'import sqlite3,sys; print(sys.version); print("SQLite",sqlite3.sqlite_version)' > "$RUNNER_TEMP/synthetic-uid-backup/versions.txt"
          set +e
          timeout 90 "$P" -I -S -B "$RUNNER_TEMP/synthetic-uid-backup/fixture.py" > "$RUNNER_TEMP/synthetic-uid-backup/test.log" 2>&1
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/synthetic-uid-backup/status.txt"
          cat "$RUNNER_TEMP/synthetic-uid-backup/test.log"
          exit "$status"
      - name: Run existing HOME guard regressions
        shell: bash
        env:
          P: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          timeout 90 "$P" -I -S -B scripts/native-linux-migrated-update.test.py TransitionHomeTests > "$RUNNER_TEMP/synthetic-uid-backup/existing-guard.log" 2>&1 || { cat "$RUNNER_TEMP/synthetic-uid-backup/existing-guard.log"; exit 1; }
          cat "$RUNNER_TEMP/synthetic-uid-backup/existing-guard.log"
      - name: Retain synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-uid-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synthetic-uid-backup
          if-no-files-found: warn
          retention-days: 7

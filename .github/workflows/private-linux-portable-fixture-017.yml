name: Private actual017 portable transport (unsigned, never acceptance)

on:
  # Registration only. Pushes cannot execute the package job.
  push:
    branches: [validation/private-linux-portable-fixture-017]
  workflow_dispatch:
    inputs:
      producer_profile:
        description: Independent canonical JSON profile without tools; actual successful017 assembly/API/ZIP/member pins, signed016 thirteen-file pins and signed017 plan SHA. No defaults or policy overrides.
        required: true
        type: string
      producer_profile_sha256:
        description: SHA256 of the exact producer_profile text (pretty two-space JSON, no trailing newline). Tool pins are derived only after controlled validator builds.
        required: true
        type: string
      signed_inputs:
        description: Canonical JSON of schemaVersion and signed016/signed017 Actions artifact carriers. Exact run/attempt/job/workflow/source/tree/ZIP and member identities; carriers are not signature authority. No draft-write permission.
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/private-linux-portable-fixture-017'
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      CREATOR_PRIVATE_PORTABLE_017: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
      - name: Install locked inspection dependencies without hooks
        run: npm ci --ignore-scripts
      - name: Pure regressions before downloads or native dependencies
        run: node --test scripts/private-linux-portable-fixture-017.test.cjs
      - name: Bind independent requests, actual successful APIs and exact data-only artifact downloads
        id: download
        uses: actions/github-script@v8
        env:
          PRODUCER_PROFILE: ${{ inputs.producer_profile }}
          PRODUCER_PROFILE_SHA256: ${{ inputs.producer_profile_sha256 }}
          SIGNED_INPUTS: ${{ inputs.signed_inputs }}
        with:
          script: |
            const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),{execFileSync}=require('node:child_process');
            const lane=require('./scripts/private-linux-portable-fixture-017.cjs'),base=require('./scripts/linux-016-portable-package.cjs');
            const keys=(v,n)=>{assert.ok(v&&typeof v==='object'&&!Array.isArray(v));assert.deepEqual(Object.keys(v).sort(),[...n].sort());};
            const sha=(v,n=64)=>assert.ok(typeof v==='string'&&new RegExp(`^[a-f0-9]{${n}}$`).test(v));
            const id=v=>assert.ok(Number.isSafeInteger(v)&&v>0);
            const pin=(v,max)=>{keys(v,['size','sha256']);id(v.size);sha(v.sha256);assert.ok(v.size<=max);};
            const parse=(text,max)=>{assert.ok(typeof text==='string'&&Buffer.byteLength(text)>0&&Buffer.byteLength(text)<=max);const v=JSON.parse(text);assert.equal(text,JSON.stringify(v,null,2));return v;};
            const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
            lane.admission(process.env);assert.equal(context.sha,process.env.GITHUB_SHA);
            const profile=parse(process.env.PRODUCER_PROFILE,32768),carriers=parse(process.env.SIGNED_INPUTS,32768);
            sha(process.env.PRODUCER_PROFILE_SHA256);assert.equal(hash(Buffer.from(process.env.PRODUCER_PROFILE)),process.env.PRODUCER_PROFILE_SHA256);
            keys(profile,['schemaVersion','profile','assembly017','signed016','signed017']);assert.equal(profile.schemaVersion,1);assert.equal(profile.profile,lane.PROFILE);
            const a=profile.assembly017;keys(a,['runId','runAttempt','jobId','workflowId','artifactId','zip','files']);
            for(const k of ['runId','runAttempt','jobId','workflowId','artifactId'])id(a[k]);pin(a.zip,base.LIMITS.zip);keys(a.files,Object.keys(lane.ROLES));
            const members=new Set();
            for(const [role,v]of Object.entries(a.files)){keys(v,['member','size','sha256']);pin({size:v.size,sha256:v.sha256},role==='manifest'?65536:['receipt','expected','integrity','api'].includes(role)?2*1024*1024:base.LIMITS.file);assert.ok(base.relative(v.member)&&path.posix.basename(v.member)===lane.ROLES[role]);assert.ok(!members.has(v.member.toLowerCase()));members.add(v.member.toLowerCase());}
            keys(profile.signed016,['planSha256','files']);sha(profile.signed016.planSha256);keys(profile.signed016.files,lane.LEGACY_NAMES);

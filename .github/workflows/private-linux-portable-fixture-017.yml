            for(const k of ['runId','runAttempt','jobId','workflowId','artifactId'])id(c[k]);sha(c.sourceCommit,40);sha(c.sourceTree,40);pin(c.zip,base.LIMITS.zip);keys(c.members,lane.LEGACY_NAMES);
            const names=new Set();for(const [name,member]of Object.entries(c.members)){assert.ok(base.relative(member)&&path.posix.basename(member)===name);assert.ok(!names.has(member.toLowerCase()));names.add(member.toLowerCase());}
            const d=carriers.signed017;keys(d,['jobId','artifactId','zip','files']);id(d.jobId);id(d.artifactId);pin(d.zip,1024*1024*1024);
            keys(d.files,['private017-signed.zip','approved-plan.json','signed-input.json']);const seen=new Set();
            for(const [name,v]of Object.entries(d.files)){keys(v,['member','size','sha256']);pin({size:v.size,sha256:v.sha256},name.endsWith('.zip')?1024*1024*1024:128*1024);assert.ok(base.relative(v.member)&&path.posix.basename(v.member)===name);assert.ok(!seen.has(v.member.toLowerCase()));seen.add(v.member.toLowerCase());}
            assert.notEqual(d.artifactId,a.artifactId);
            const run=(program,args,options={})=>execFileSync(program,args,{cwd:process.env.GITHUB_WORKSPACE,encoding:'utf8',timeout:30000,maxBuffer:2*1024*1024,...options});
            lane.sourceCheck(process.env,run);run('git',['diff','--exit-code','HEAD','--','scripts/stage-private-linux-update-fixture-017.py']);assert.equal(String(run('git',['status','--porcelain=v1','--untracked-files=all','--','scripts/stage-private-linux-update-fixture-017.py'])).trim(),'');run('git',['merge-base','--is-ancestor',lane.SOURCE.sourceCommit,'HEAD']);
            const allowed=new Set([...lane.SCOPE_PATHS.filter(n=>n.startsWith('scripts/')),lane.WORKFLOW,'scripts/private-linux-portable-fixture-017.test.cjs','scripts/linux-016-portable-package.test.cjs','scripts/linux-016-portable-production.test.cjs']);
            for(const name of String(run('git',['diff','--name-only','-z',lane.SOURCE.sourceCommit,'HEAD'])).split('\0').filter(Boolean))assert.ok(allowed.has(name),'Only reviewed sidecar files may differ from actual017 source');
            const request=async route=>(await github.request(`GET /repos/BOBWORKS-XR/CREATOR-HUB/${route}`)).data;
            async function bind(expected,fixed={}){
              const proof={run:await request(`actions/runs/${expected.runId}`),job:await request(`actions/jobs/${expected.jobId}`),workflow:await request(`actions/workflows/${expected.workflowId}`),artifact:await request(`actions/artifacts/${expected.artifactId}`),commit:await request(`git/commits/${expected.sourceCommit}`)};
              const {run,job,workflow,artifact,commit}=proof;
              for(const [k,v]of Object.entries({id:expected.runId,run_attempt:expected.runAttempt,workflow_id:expected.workflowId,head_sha:expected.sourceCommit,event:'workflow_dispatch',status:'completed',conclusion:'success'}))assert.equal(run[k],v);
              for(const repo of [run.repository,run.head_repository]){assert.equal(repo.id,1364807512);assert.equal(repo.full_name,'BOBWORKS-XR/CREATOR-HUB');}
              assert.equal(workflow.id,expected.workflowId);assert.equal(workflow.path,run.path);assert.match(run.path,/^\.github\/workflows\/[a-z0-9-]+\.yml$/);
              assert.equal(commit.sha,expected.sourceCommit);assert.equal(commit.tree.sha,expected.sourceTree);
              for(const [k,v]of Object.entries({id:expected.jobId,run_id:expected.runId,run_attempt:expected.runAttempt,head_sha:expected.sourceCommit,status:'completed',conclusion:'success'}))assert.equal(job[k],v);assert.ok(job.labels.includes('ubuntu-22.04'));
              assert.equal(artifact.id,expected.artifactId);assert.equal(artifact.expired,false);assert.equal(artifact.size_in_bytes,expected.zip.size);assert.equal(artifact.digest,`sha256:${expected.zip.sha256}`);
              for(const [k,v]of Object.entries({id:expected.runId,head_sha:expected.sourceCommit,head_branch:run.head_branch,repository_id:1364807512,head_repository_id:1364807512}))assert.equal(artifact.workflow_run[k],v);
              const times=[job.started_at,artifact.created_at,job.completed_at].map(Date.parse);assert.ok(times.every(Number.isFinite)&&times[0]<=times[1]&&times[1]<=times[2]);
              if(fixed.job)assert.equal(job.name,fixed.job);if(fixed.branch)assert.equal(run.head_branch,fixed.branch);if(fixed.workflow)assert.equal(run.path,fixed.workflow);if(fixed.artifact)assert.equal(artifact.name,fixed.artifact);
              return proof;
            }
            const exact17={...a,...lane.SOURCE},assembly=await bind(exact17,{job:'assemble',branch:'validation/linux-private-update-fixture-017',workflow:'.github/workflows/private-linux-update-fixture-017.yml',artifact:`private-linux-update-fixture-017-${a.runId}-${a.runAttempt}`});
            const signed016=await bind(c),signed017=await bind({...exact17,...d},{job:'stage-input',branch:'validation/linux-private-update-fixture-017',workflow:'.github/workflows/private-linux-update-fixture-017.yml',artifact:`private017-signed-input-${a.runId}-${a.runAttempt}`});
            const temp=fs.realpathSync(process.env.RUNNER_TEMP),stage=path.join(temp,'private017-portable-stage');assert.equal(fs.existsSync(stage),false);fs.mkdirSync(stage,{mode:0o700});
            const input=path.join(stage,'input');fs.mkdirSync(input,{mode:0o700});
            const write=(name,body)=>{assert.ok(Buffer.byteLength(body)<=2*1024*1024);fs.writeFileSync(path.join(stage,name),body,{flag:'wx',mode:0o600});};
            async function download(artifactId,expected,file){const {data}=await github.rest.actions.downloadArtifact({owner:'BOBWORKS-XR',repo:'CREATOR-HUB',artifact_id:artifactId,archive_format:'zip'});assert.ok(Buffer.isBuffer(data)||data instanceof ArrayBuffer);const bytes=Buffer.from(data);assert.equal(bytes.length,expected.size);assert.equal(hash(bytes),expected.sha256);fs.writeFileSync(file,bytes,{flag:'wx',mode:0o600});}
            await download(a.artifactId,a.zip,path.join(input,'assembly017.zip'));await download(c.artifactId,c.zip,path.join(stage,'signed016-carrier.zip'));await download(d.artifactId,d.zip,path.join(stage,'signed017-carrier.zip'));
            write('request.json',JSON.stringify({profile,carriers,profileSha256:process.env.PRODUCER_PROFILE_SHA256},null,2)+'\n');write('download-proof.json',JSON.stringify({assembly,signed016,signed017,releaseReady:false},null,2)+'\n');

name: Installed integrated Linux migration and normal reopen

on:
  workflow_dispatch:
  push:
    branches: [validation/linux-integrated-migration]
    paths:
      - .github/workflows/native-linux-integrated-migration.yml
      - scripts/native-linux-integrated-migration.py
      - scripts/native-linux-integrated-migration.test.py

permissions:
  contents: read
  actions: read

jobs:
  migration:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/linux-integrated-migration' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CREATOR_INTEGRATED_MIGRATION: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 4f2243591fa51243c10250b8a23a30e60f8d2888
          path: migration-helpers
          persist-credentials: false
      - name: Portable refusal and finite native contract tests
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 -B scripts/native-linux-integrated-migration.test.py
      - name: Read only the exact current producer and previous public release
        uses: actions/github-script@v8
        with:
          script: |
            const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
            const repo=context.repo,source='bbd0a5d58562a3d8af0c84e5360eef9d26803eef',runId=39130359610,id=12137857868;
            assert.equal(`${repo.owner}/${repo.repo}`,'BOBWORKS-XR/CREATOR-HUB');
            assert.equal(process.env.GITHUB_REPOSITORY_ID,'1364807512');
            assert.equal(process.env.GITHUB_REF,'refs/heads/validation/linux-integrated-migration');
            assert.equal(process.env.RUNNER_ENVIRONMENT,'github-hosted');assert.equal(process.env.RUNNER_OS,'Linux');assert.equal(process.env.RUNNER_ARCH,'X64');
            const {data:run}=await github.rest.actions.getWorkflowRun({...repo,run_id:runId});
            assert.equal(run.head_sha,source);assert.equal(run.run_attempt,1);assert.equal(run.conclusion,'success');
            assert.equal(run.status,'completed');assert.equal(run.event,'workflow_dispatch');assert.equal(run.repository.id,1364807512);
            assert.equal(run.path,'.github/workflows/unix-managed-assembly.yml');assert.equal(run.head_branch,'validation/linux-integrated-candidate-014');
            const {data:job}=await github.rest.actions.getJobForWorkflowRun({...repo,job_id:117684180444});
            assert.equal(job.run_id,runId);assert.equal(job.conclusion,'success');assert.ok(job.name.startsWith('assembly (linux,'));
            const {data:artifact}=await github.rest.actions.getArtifact({...repo,artifact_id:id});
            assert.equal(artifact.expired,false);assert.equal(artifact.name,'signed-unix-hub-linux-39130359610-1');
            assert.equal(artifact.workflow_run.id,runId);assert.equal(artifact.workflow_run.head_sha,source);
            assert.equal(artifact.workflow_run.repository_id,1364807512);assert.equal(artifact.workflow_run.head_repository_id,1364807512);
            assert.equal(artifact.size_in_bytes,182723307);
            const hash=raw=>crypto.createHash('sha256').update(raw).digest('hex');
            assert.equal(artifact.digest,'sha256:c76c138b3297e347e834d43c1ac1a82eb883b41663df08ea44f008c5846e03e5');
            const temp=fs.realpathSync(process.env.RUNNER_TEMP);
            function write(name,bytes){fs.writeFileSync(path.join(temp,name),bytes,{flag:'wx',mode:0o600});}
            const {data:zip}=await github.rest.actions.downloadArtifact({...repo,artifact_id:id,archive_format:'zip'});
            const raw=Buffer.from(zip);assert.equal(raw.length,182723307);assert.equal(hash(raw),artifact.digest.slice(7));write('migration-current.zip',raw);
            const {data:helpers}=await github.rest.actions.getWorkflowRun({...repo,run_id:39133351860});
            assert.equal(helpers.head_sha,'4f2243591fa51243c10250b8a23a30e60f8d2888');assert.equal(helpers.conclusion,'success');
            assert.equal(helpers.path,'.github/workflows/native-linux-integrated-pages.yml');assert.equal(helpers.repository.id,1364807512);
            const contracts={
              'src-tauri/src/builtin.rs':'e6597c01bdb05e7c81b592bb903d29bce75a9c27a4b1d9d226e220892d612cd2',
              'src-tauri/src/convergence.rs':'6bc87be48c2801d2459e0499bdf97d59d7cd832721e66fd67e2ad7851dcc0162',
              'modules/mcp/launcher/src-tauri/src/lib.rs':'c0646916dda1965fdf487c8330f7908805eec5af26d0601a494e0089215c0f20',
              'modules/mcp/launcher/src-tauri/src/product_settings.rs':'1d675ff028e75ab1075edcb2a931b56435b844817a2252adf83f965cdab0846b',
              'native/mcp-router/src/lib.rs':'3169a77476123ab1da8f4e4edc008ec92133553335011662e6e4c630bedf353b',
              'native/mcp-router/src/bootstrap.rs':'f2496c99d5c5cc646d62e146cfbaef7afe29da49eee6c3674c8d06a4910205d6',
              'modules/mcp/launcher/src-tauri/src/client_migration.rs':'70b666c7b790ae38cc34f49eecbf3a341a5a50144a0f684424d7c1e50aff87c3',
              'modules/mcp/launcher/src-tauri/src/migration_recovery.rs':'857e98413bff66aa398f4c792bc507464b295165c8184c8b02160fa6b099444e'};
            for(const [file,sha] of Object.entries(contracts)) {
              const {data}=await github.rest.repos.getContent({...repo,path:file,ref:source});
              assert.equal(data.encoding,'base64');const bytes=Buffer.from(data.content,'base64');assert.ok(bytes.length<=200000);assert.equal(hash(bytes),sha);
            }
            const oldRepo={owner:'BOBWORKS-XR',repo:'CREATOR-WORKS-UNITY-MCP'};
            const {data:release}=await github.rest.repos.getRelease({...oldRepo,release_id:402569194});
            assert.equal(release.tag_name,'v2.7.7');assert.equal(release.draft,false);assert.equal(release.target_commitish,'9cd12e28d1dd05057b84166d4718a5d6369eff93');
            const {data:tag}=await github.rest.git.getRef({...oldRepo,ref:'tags/v2.7.7'});
            assert.equal(tag.object.type,'commit');assert.equal(tag.object.sha,release.target_commitish);
            const old=release.assets.filter(a=>a.id===608030423);assert.equal(old.length,1);
            assert.equal(old[0].name,'Creator-Works-MCP-2.7.7-standalone.zip');assert.equal(old[0].size,1769943);
            assert.equal(old[0].digest,'sha256:21ccf2b284207a5c76d188e59e2967282a39bfd7457a13ac7e3ffb91b3002884');
            assert.equal(old[0].browser_download_url,'https://github.com/BOBWORKS-XR/CREATOR-WORKS-UNITY-MCP/releases/download/v2.7.7/Creator-Works-MCP-2.7.7-standalone.zip');
            const response=await fetch(old[0].browser_download_url,{redirect:'follow',signal:AbortSignal.timeout(60000)});assert.equal(response.status,200);
            const chunks=[];let received=0;
            for await(const chunk of response.body){received+=chunk.length;assert.ok(received<=1769943);chunks.push(chunk);}
            const previous=Buffer.concat(chunks);assert.equal(previous.length,1769943);assert.equal(hash(previous),old[0].digest.slice(7));write('migration-previous.zip',previous);
            write('migration-provenance.json',Buffer.from(JSON.stringify({source,runId,artifact:id,artifactSha256:hash(raw),sourceContracts:contracts,
              previous:{releaseId:release.id,source:tag.object.sha,assetId:old[0].id,sha256:hash(previous)},releaseReady:false},null,2)));
      - name: Stage fixed original archive members only
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP']).resolve();out=temp/'integrated-migration-input';out.mkdir(mode=0o700)
          chosen={
            'native-packages/Creator Hub_0.1.14_amd64.deb':('native.deb',63874886,'a4d2db459966f475a982cbe72591f32222e9c7050a1a7f4c870e1c6634c0f8b3'),
            'modules/mcp/server/runtime/node':('node',123459976,'62d66443847de1f527f74afe715900b12884ace52136dc9cd8e91e61acc2f527'),
            'modules/routing/runtime.json':('runtime.json',None,None),
            'modules/routing/router.json':('router.json',None,None),
          }
          def take(archive,selected):
              with zipfile.ZipFile(archive) as z:
                  entries=z.infolist();assert 0<len(entries)<=128 and sum(e.file_size for e in entries)<=768*1024*1024
                  names=set()
                  for e in entries:
                      n=e.filename;assert n not in names and '\\' not in n and ':' not in n and not n.startswith('/')
                      assert all(p not in ('','.','..') for p in n.rstrip('/').split('/'))
                      assert stat.S_IFMT(e.external_attr>>16) in (0,stat.S_IFREG,stat.S_IFDIR) and not e.flag_bits&1
                      assert 0<=e.file_size<=256*1024*1024;names.add(n)
                  assert set(selected)<=names
                  for n,(dest,size,sha) in selected.items():
                      e=z.getinfo(n);assert not e.is_dir() and e.file_size<=(size or 16384)
                      raw=z.read(e)
                      if size is not None:assert len(raw)==size and hashlib.sha256(raw).hexdigest()==sha
                      with (out/dest).open('xb') as f:os.chmod(f.name,0o600);f.write(raw)
          take(temp/'migration-current.zip',chosen)
          take(temp/'migration-previous.zip',{'Creator-Works-MCP-2.7.7/creator-works-mcp.mjs':('legacy-server.mjs',1221209,'8d7cbe21d3b3691d6b1aa052846d6ee36f4274c18bd4228c6d4a73583be74149')})
          PY
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Provision native fixture dependencies only
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libxdo3 libxres1 librsvg2-2 \
            python3-gi python3-toml gir1.2-gtk-3.0 gir1.2-atspi-2.0 gir1.2-gdkpixbuf-2.0 at-spi2-core webkit2gtk-driver \
            dbus-x11 xvfb xauth openbox fonts-dejavu-core policykit-1
      - name: Verify exact package controls before disposable installation
        run: |
          python3 -B scripts/linux-retirement-package-verify.py "$RUNNER_TEMP/integrated-migration-input/native.deb" \
            8b9e937f3b0c2e9336732b0c92f6a6bf33b8f25f693f52c9a27a34f1585d232c \
            5eb715286ff8d8cda8e612f8dc9d28d396068b2cdd470a5f3d92d7355e3e37c9 0.1.14 --profile integrated-candidate
      - name: Restore only measured hosted-runner policy directory modes
        run: |
          python3 -B - <<'PY'
          import os,stat,subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REF']=='refs/heads/validation/linux-integrated-migration' and os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          for p in map(Path,('/','/usr')):
              s=p.lstat();assert p.resolve()==p and stat.S_ISDIR(s.st_mode) and s.st_uid==s.st_gid==0 and not s.st_mode&0o7022
          for p in map(Path,('/usr/share','/usr/share/polkit-1','/usr/share/polkit-1/actions')):
              s=p.lstat();assert p.resolve()==p and stat.S_ISDIR(s.st_mode) and s.st_uid==s.st_gid==0 and stat.S_IMODE(s.st_mode) in (0o755,0o777)
              if stat.S_IMODE(s.st_mode)==0o777:subprocess.run(['/usr/bin/sudo','-n','/usr/bin/chmod','0755',str(p)],check=True)
              a=p.lstat();assert (s.st_dev,s.st_ino,s.st_uid,s.st_gid)==(a.st_dev,a.st_ino,0,0) and stat.S_IMODE(a.st_mode)==0o755
          PY
      - name: Install only the already verified current DEB
        run: sudo dpkg --install "$RUNNER_TEMP/integrated-migration-input/native.deb"
      - name: Build pinned test driver only
        run: cargo install tauri-driver --version 2.1.0 --locked --root "$RUNNER_TEMP/migration-driver"
      - name: Bind installed image and fixed private inputs
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,stat
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']).resolve();d=t/'integrated-migration-input'
          def pin(p,mode,uid):
              s=p.lstat();assert p.resolve()==p and stat.S_ISREG(s.st_mode) and stat.S_IMODE(s.st_mode)==mode and s.st_uid==uid
              return {'path':str(p),'size':s.st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          hub=pin(Path('/usr/bin/creator-hub'),0o755,0)
          assert hub['size']==27368608 and hub['sha256']=='97717cf5b454315598ac3addaf59d98b7a27c2fdff710563412cfa6b8ec3e0ea'
          package=pin(d/'native.deb',0o600,os.getuid());package['version']='0.1.14'
          b={'schemaVersion':1,'sourceCommit':'bbd0a5d58562a3d8af0c84e5360eef9d26803eef','package':package,'hub':hub,
             'driver':pin(t/'migration-driver/bin/tauri-driver',0o755,os.getuid()),'legacyServer':pin(d/'legacy-server.mjs',0o600,os.getuid()),
             'node':pin(d/'node',0o600,os.getuid()),'runtime':json.loads((d/'runtime.json').read_bytes()),
             'runtimeSha256':hashlib.sha256((d/'runtime.json').read_bytes()).hexdigest(),'routerSha256':json.loads((d/'router.json').read_bytes())['sha256']}
          with (t/'integrated-migration-input.json').open('x') as f:os.chmod(f.name,0o600);json.dump(b,f)
          PY
      - name: Native migration approvals and normal close/reopen
        run: /usr/bin/python3 -B scripts/native-linux-integrated-migration.py "$RUNNER_TEMP/integrated-migration-input.json"
      - name: Retain only fixture receipts and bounded native GTK captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-linux-migration-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/migration-provenance.json
            ${{ runner.temp }}/linux-integrated-migration/report.json
            ${{ runner.temp }}/linux-integrated-migration/gtk-*.json
            ${{ runner.temp }}/linux-integrated-migration/fixtures.json
            ${{ runner.temp }}/linux-integrated-migration/*.stdout
            ${{ runner.temp }}/linux-integrated-migration/*.stderr

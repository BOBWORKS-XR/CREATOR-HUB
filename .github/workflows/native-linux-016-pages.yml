name: Finite 016 native DEB pages and migration cancellation
on:
  push:
    branches: [validation/native-linux-016]
  workflow_dispatch:
    inputs:
      profile:
        description: Exact approved JSON per scripts/native-linux-016-input.cjs; modes pages or migration-cancel only; approval migration unfinished
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.ref == 'refs/heads/validation/native-linux-016' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CREATOR_NATIVE_LINUX_016: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
      - name: Pure fixture preflights before API downloads or package execution
        run: |
          node --check scripts/native-linux-016-input.cjs
          node --test scripts/native-linux-016-input.test.cjs
          python3 -B scripts/native-linux-016.test.py
      - name: Validate exact producer API evidence and download only bound data
        uses: actions/github-script@v8
        env:
          PROFILE: ${{ inputs.profile }}
        with:
          script: |
            const lane = require(require('node:path').join(process.env.GITHUB_WORKSPACE, 'scripts/native-linux-016-input.cjs'));
            await lane.run({github, context, profile: process.env.PROFILE});
      - name: Inspect DEB controls and all build-bound resources without executing them
        run: python3 -B scripts/native-linux-016-stage.py
      - name: Provision only disposable native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libgtk-3-0 libxdo3 libxres1 librsvg2-2 policykit-1 python3-gi gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 webkit2gtk-driver dbus-x11 xvfb xauth openbox fonts-dejavu-core
      - name: Refuse pre-existing apps, then install only verified original DEBs and 016
        run: |
          python3 -B - <<'PY'
          import os, subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REF']=='refs/heads/validation/native-linux-016'
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          for package,path in [('creator-hub','/usr/bin/creator-hub'),('creator-works-mcp','/usr/bin/creator-works-mcp-launcher'),('creator-project-setup','/usr/bin/creator-project-setup')]:
              result=subprocess.run(['/usr/bin/dpkg-query','-W','-f=${Status}',package],capture_output=True)
              assert result.returncode==1 and not result.stdout and not os.path.lexists(path)
          t=Path(os.environ['RUNNER_TEMP'])
          subprocess.run(['/usr/bin/sudo','-n','/usr/bin/dpkg','--install',str(t/'native-linux-016-input/mcp.deb'),str(t/'native-linux-016-input/setup.deb'),str(t/'native-linux-016-stage/deb.deb')],check=True)
          PY
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Build only the pinned WebDriver test tool, never product code
        run: cargo install tauri-driver --version 2.1.0 --locked --root "$RUNNER_TEMP/native-linux-016-driver"
      - name: Bind the test driver before any native product execution
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,stat
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']);p=t/'native-linux-016-driver/bin/tauri-driver';s=p.lstat()
          assert p.resolve()==p and stat.S_ISREG(s.st_mode) and s.st_nlink==1 and s.st_uid==os.getuid() and stat.S_IMODE(s.st_mode)==0o755
          value={'size':s.st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          f=t/'native-linux-016-stage/driver.json'
          with f.open('x') as stream:
              os.chmod(f,0o600);json.dump(value,stream)
          PY
      - name: Real 016 Projects home, direct pages or Not now, then normal close and manual reopen
        run: python3 -B scripts/native-linux-016-pages.py
      - name: Retain scoped receipts and native surfaces, not package payloads or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-016-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-linux-016-input/profile.json
            ${{ runner.temp }}/native-linux-016-input/api-binding.json
            ${{ runner.temp }}/native-linux-016-stage/binding.json
            ${{ runner.temp }}/native-linux-016-result/before.json
            ${{ runner.temp }}/native-linux-016-result/report.json
            ${{ runner.temp }}/native-linux-016-result/*/session.json
            ${{ runner.temp }}/native-linux-016-result/*/physical/*.png
            ${{ runner.temp }}/native-linux-016-result/first/driver.stdout
            ${{ runner.temp }}/native-linux-016-result/first/driver.stderr
            ${{ runner.temp }}/native-linux-016-result/reopened/driver.stdout
            ${{ runner.temp }}/native-linux-016-result/reopened/driver.stderr

name: Published legacy uninstall retention (disposable only)

on:
  push:
    branches: ['validation/legacy-retention-014']
    paths: ['.github/workflows/native-legacy-uninstall-retention.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention:
    if: github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.ref == 'refs/heads/validation/legacy-retention-014'
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        product: [mcp, setup]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
      - name: Pure guards, canonical filesystem and named registry record regressions only
        shell: pwsh
        run: node --test scripts/native-legacy-uninstall-retention.test.cjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Compile exact Root production adapter and pure regressions, without packaging
        id: adapter
        shell: pwsh
        run: |
          $messages = & cargo test --manifest-path src-tauri/Cargo.toml --locked --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Root adapter compilation failed before any installation.' }
          $bins = @($messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object {
            $_.reason -ceq 'compiler-artifact' -and $_.target.name -ceq 'creator-hub' -and $_.profile.test -eq $true -and $_.executable
          })
          if ($bins.Count -ne 1) { throw 'Expected one exact freshly compiled Root test executable.' }
          $bin = [string]$bins[0].executable
          & $bin legacy_removal_windows::tests:: --skip native_windows_pinned_removal
          if ($LASTEXITCODE -ne 0) { throw 'Root adapter pure regressions failed.' }
          "executable=$bin" >> $env:GITHUB_OUTPUT
      - name: Install exact baseline, capture read-only preflight and actual adapter outcome, prove retention
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CREATOR_LEGACY_RETENTION_EXPERIMENT: '1'
        run: |
          & ./scripts/native-legacy-uninstall-retention.ps1 -Product '${{ matrix.product }}' -OutputDirectory (Join-Path $env:RUNNER_TEMP 'legacy-retention-${{ matrix.product }}') -AdapterTestExecutable '${{ steps.adapter.outputs.executable }}'
      - name: Preserve official bytes, generated uninstaller provenance, synthetic before-images and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-retention-${{ matrix.product }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-retention-${{ matrix.product }}/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

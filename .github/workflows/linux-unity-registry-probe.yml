name: Linux Unity beta9 read-only registry execution probe

on:
  push:
    branches: [validation/linux-unity-registry-probe]
  workflow_dispatch:
    inputs:
      execution_request:
        description: Run only the pinned CLI help and empty projects-list probe in a disposable HOME; not discovery acceptance
        required: true
        default: inspect-only
        type: choice
        options:
          - inspect-only
          - execute-readonly-beta9

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.repository == 'BOBWORKS-XR/CREATOR-HUB' && github.repository_id == '1364807512' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/linux-unity-registry-probe' &&
      github.workflow_ref == 'BOBWORKS-XR/CREATOR-HUB/.github/workflows/linux-unity-registry-probe.yml@refs/heads/validation/linux-unity-registry-probe' &&
      inputs.execution_request == 'execute-readonly-beta9'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      UNITY_REGISTRY_PROBE_REQUEST: ${{ inputs.execution_request }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mandatory pure authority, Python 3.10 AST and workflow YAML checks
        run: /usr/bin/python3 -I -B scripts/native-linux-unity-cli-registry-probe.test.py
      - name: Execute only the pinned beta9 helper and read-only list commands
        run: /usr/bin/python3 -I -B scripts/native-linux-unity-cli-registry-probe.py probe
      - name: Retain bounded command output and scoped receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-unity-registry-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-unity-registry-probe/evidence/
          if-no-files-found: warn
          retention-days: 7
